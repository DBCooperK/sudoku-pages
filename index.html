<script>const data={"config":{"version":"2026-10-08","updatedOn":"2026-10-08","brandName":"DBC","operatorName":"陈燚","contactEmail":"dbcooperk@gmail.com","publicUrl":"https://dbcooperk.github.io/sudoku-pages/"},"sections":["local","google","ads","telemetry","rights","security","regions","changes"],"dictionaries":{"zh-Hans":{"name":"简体中文","messages":{"policy.title":"隐私协议","policy.choice":"请阅读协议并选择是否同意。","policy.reject":"不同意","policy.accept":"同意并进入","policy.rejected":"需要同意协议才能进入，您可以退出游戏。","policy.saveFailed":"选择未能保存，请重试。","policy.updated":"更新日期：{date}","policy.security":"6. 服务提供方、安全与跨境处理\n我们使用 Google Play Games、AdMob 和 Firebase 等服务，并采取合理的访问控制与安全措施。必要时，可为履行法律义务、处理纠纷或保护合法权益提供必要信息。\n\n服务提供方可能在您所在地区之外处理数据；适用时采用充分性决定、标准合同条款或其他法律认可的保障。您可联系我们了解适用保障。政策网页使用 GitHub Pages 托管，GitHub 可能为安全目的处理访问者 IP 地址。","policy.regions":"7. 地区补充与您的权利\n欧洲经济区和英国：必要的账号与云存档处理依据履行您请求的服务约定，可选统计和错误报告依据您的同意；必要的安全与防滥用处理，在法律允许范围内依据合法利益并权衡您的权利。广告授权另按适用规则处理。依法享有访问、更正、删除、限制及反对处理、数据可携带、撤回同意和向当地监管机构投诉等权利。撤回不影响此前合法处理。\n\n美国适用地区：当地法律适用时，可请求了解、访问、更正、删除个人信息，并选择退出依法属于销售、共享或定向广告的数据处理；我们不会因依法行使权利而给予法律禁止的不利待遇。\n\n其他地区按当地适用法律保障数据权利。规则依据法律的适用范围确定，不根据界面语言推断。隐私请求请联系上方邮箱。","policy.intro":"我们重视您的隐私。本协议说明 Sudoku 使用哪些信息，以及这些信息的用途。","policy.local":"1. 游戏数据\n我们在您的设备上保存游戏进度、成绩和设置，用于保留游玩记录并提供正常的游戏体验。","policy.google":"2. 账号与云存档\n使用 Google Play Games 时，相关服务会处理玩家标识、昵称、头像、排名及成绩，用于账号识别、资料展示和排行榜。相关资料可能按 Google 的隐私设置向其他玩家显示。\n\n使用云存档时，进度、成绩、完成记录、未完成对局及必要同步标识通过 Google Play Games Saved Games 保存，用于恢复和跨设备同步。本机设置及隐私授权选择不随云存档同步。退出登录不会自动删除这些记录。","policy.ads":"3. 广告服务\n我们使用 Google AdMob 提供自愿观看的激励广告。广告服务可能处理 IP 地址及据此推测的大致位置、设备和应用信息、设备或账号标识符（包括广告标识符）、互动记录及诊断信息，用于广告展示、效果统计和防欺诈。相关广告授权按地区要求单独处理。","policy.telemetry":"4. 统计、错误报告与运行配置\n经您分别选择启用后，Firebase Analytics 和 Crashlytics 会处理应用使用情况、设备与系统信息、应用版本、安装标识和错误记录，用于了解使用情况、发现问题及改善稳定性。您可在设置中分别撤回；拒绝可选采集仍可游玩。关闭原生错误报告可能需要重启应用才能完全生效。\n\n启用 Firebase Remote Config 时，该服务可能处理安装标识，用于提供应用运行配置。","policy.rights":"5. 数据保存与管理\n本机数据保留至被覆盖或通过设备系统清除；系统备份依系统规则管理。云存档及排行榜记录为持续提供账号服务而保存，可通过相应流程申请删除。统计明细按分析服务配置的期限及清理周期处理，仅在分析和改进所需范围内保留；汇总报告可能保留更久。Crashlytics 通常在保留相关错误记录及标识 90 天后开始从在线及备份系统删除。其他服务标识按相应服务规则管理。\n\n您可在设置中撤回统计和错误报告授权，并通过 Google 的账号或游戏数据管理功能管理相应记录。卸载、清除本机数据或退出登录不等于删除所有云端及第三方记录；撤回授权也不自动删除已合法处理的数据。\n\n请联系上方邮箱申请访问、更正、导出或删除我们控制的数据。我们仅要求必要的身份核实资料，并在适用法律规定的期限内回复；对服务提供方代我们处理的数据，我们负责按适用规则处理请求。Google 独立管理的账号资料通过其对应入口管理。依法必须保留的信息会限制用途并说明原因。","policy.changes":"8. 未成年人及政策变更\n本游戏面向 16 岁及以上用户，不专门面向儿童。未达到所在地独立作出有效数据处理同意年龄的用户，应依法取得监护人有效同意。监护人若认为存在缺少必要授权的数据处理，可联系上方邮箱；我们会核实并依法采取停止处理、删除或其他必要措施。\n\n数据处理方式发生重要变化时，我们会更新政策，并依法通知您或重新征求需要的授权。您可在游戏内和公开网页查看政策。","policy.draft":"审核草稿：运营者名称、联系邮箱及公开网址将在发布前补充。","policy.contact":"开发者／品牌：{brand}\n运营主体：{operator}\n隐私联系邮箱：{email}"}},"zh-Hant":{"name":"繁體中文","messages":{"policy.title":"隱私協議","policy.choice":"請閱讀協議並選擇是否同意。","policy.reject":"不同意","policy.accept":"同意並進入","policy.rejected":"須同意協議才能進入，您可以退出遊戲。","policy.saveFailed":"未能儲存選擇，請重試。","policy.updated":"更新日期：{date}","policy.security":"6. 服務提供方、安全與跨境處理\n我們使用 Google Play Games、AdMob 和 Firebase 等服務，並採取合理的存取控制與安全措施。必要時，可為履行法律義務、處理爭議或保護合法權益提供必要資訊。\n\n服務提供方可能在您所在地區之外處理資料；適用時採用適足性認定、標準契約條款或其他法律認可的保障。您可聯絡我們瞭解適用保障。政策網頁使用 GitHub Pages 託管，GitHub 可能為安全目的處理訪客 IP 位址。","policy.regions":"7. 地區補充與您的權利\n歐洲經濟區和英國：必要的帳號與雲端存檔處理依據履行您要求的服務約定，可選統計和錯誤報告依據您的同意；必要的安全與防濫用處理，在法律允許範圍內依據合法利益並權衡您的權利。廣告授權另依適用規則處理。依法享有存取、更正、刪除、限制及反對處理、資料可攜、撤回同意和向當地監管機構申訴等權利。撤回不影響此前合法處理。\n\n美國適用地區：當地法律適用時，可請求瞭解、存取、更正、刪除個人資訊，並選擇退出依法屬於出售、共享或定向廣告的資料處理；我們不會因依法行使權利而給予法律禁止的不利待遇。\n\n其他地區依當地適用法律保障資料權利。規則依法律的適用範圍確定，不依介面語言推斷。隱私請求請聯絡上方信箱。","policy.intro":"我們重視您的隱私。本協議說明 Sudoku 使用哪些資訊，以及這些資訊的用途。","policy.local":"1. 遊戲資料\n我們在您的裝置上儲存遊戲進度、成績和設定，用於保留遊玩紀錄並提供正常的遊戲體驗。","policy.google":"2. 帳號與雲端存檔\n使用 Google Play Games 時，相關服務會處理玩家識別碼、暱稱、頭像、排名及成績，用於帳號識別、資料展示和排行榜。相關資料可能依 Google 的隱私設定向其他玩家顯示。\n\n使用雲端存檔時，進度、成績、完成紀錄、未完成對局及必要同步識別碼透過 Google Play Games Saved Games 儲存，用於恢復和跨裝置同步。本機設定及隱私授權選擇不隨雲端存檔同步。登出不會自動刪除這些紀錄。","policy.ads":"3. 廣告服務\n我們使用 Google AdMob 提供自願觀看的獎勵廣告。廣告服務可能處理 IP 位址及據此推測的大致位置、裝置和應用程式資訊、裝置或帳號識別碼（包括廣告識別碼）、互動紀錄及診斷資訊，用於廣告展示、成效統計和防詐欺。相關廣告授權依地區要求分別處理。","policy.telemetry":"4. 統計、錯誤報告與執行設定\n經您分別選擇啟用後，Firebase Analytics 和 Crashlytics 會處理應用程式使用情況、裝置與系統資訊、應用程式版本、安裝識別碼和錯誤紀錄，用於瞭解使用情況、發現問題及改善穩定性。您可在設定中分別撤回；拒絕可選蒐集仍可遊玩。關閉原生錯誤報告可能需要重新啟動應用程式才能完全生效。\n\n啟用 Firebase Remote Config 時，該服務可能處理安裝識別碼，用於提供應用程式執行設定。","policy.rights":"5. 資料儲存與管理\n本機資料保留至被覆寫或透過裝置系統清除；系統備份依系統規則管理。雲端存檔及排行榜紀錄為持續提供帳號服務而儲存，可透過相應流程申請刪除。統計明細依分析服務設定的期限及清理週期處理，僅在分析和改進所需範圍內保留；彙總報告可能保留更久。Crashlytics 通常在保留相關錯誤紀錄及識別碼 90 天後開始從線上及備份系統刪除。其他服務識別碼依相應服務規則管理。\n\n您可在設定中撤回統計和錯誤報告授權，並透過 Google 的帳號或遊戲資料管理功能管理相應紀錄。解除安裝、清除本機資料或登出不等於刪除所有雲端及第三方紀錄；撤回授權也不自動刪除已合法處理的資料。\n\n請聯絡上方信箱申請存取、更正、匯出或刪除我們控制的資料。我們僅要求必要的身分核實資料，並在適用法律規定的期限內回覆；對服務提供方代我們處理的資料，我們負責依適用規則處理請求。Google 獨立管理的帳號資料透過其對應入口管理。依法必須保留的資訊會限制用途並說明原因。","policy.changes":"8. 未成年人及政策變更\n本遊戲面向 16 歲及以上使用者，不專門面向兒童。未達所在地獨立作出有效資料處理同意年齡的使用者，應依法取得監護人有效同意。監護人若認為存在缺少必要授權的資料處理，可聯絡上方信箱；我們會核實並依法採取停止處理、刪除或其他必要措施。\n\n資料處理方式發生重要變更時，我們會更新政策，並依法通知您或重新徵求需要的授權。您可在遊戲內和公開網頁查看政策。","policy.draft":"審核草稿：營運者名稱、聯絡信箱及公開網址將於發布前補充。","policy.contact":"開發者／品牌：{brand}\n營運主體：{operator}\n隱私聯絡信箱：{email}"}},"en":{"name":"English","messages":{"policy.title":"Privacy Policy","policy.choice":"Please read the policy and choose whether to accept.","policy.reject":"Disagree","policy.accept":"Agree & enter","policy.rejected":"Agreement is required to enter. You may close the game.","policy.saveFailed":"Could not save your choice. Please try again.","policy.updated":"Last updated: {date}","policy.security":"6. Providers, security and international transfers\nWe use services including Google Play Games, AdMob and Firebase and take reasonable access-control and security measures. Necessary information may be disclosed to meet legal duties, resolve disputes or protect legitimate rights.\n\nProviders may process data outside your region, using adequacy decisions, standard contractual clauses or other legally recognized safeguards where applicable. Contact us for details. The policy website uses GitHub Pages; GitHub may process visitors' IP addresses for security.","policy.regions":"7. Regional provisions and your rights\nEEA and UK: necessary account and cloud-save processing supports the services you request; optional analytics and error reports rely on consent. Necessary security and abuse-prevention processing may rely on legitimate interests where lawful, balanced against your rights. Advertising consent is handled separately. Applicable rights include access, correction, deletion, restriction, objection, portability, consent withdrawal and complaints to local regulators. Withdrawal does not affect earlier lawful processing.\n\nApplicable US regions: local law may grant rights to know, access, correct or delete personal information and opt out of processing legally classified as sale, sharing or targeted advertising, without unlawful discrimination.\n\nOther regions: applicable local data rights apply. Legal applicability, not interface language, determines the rules. Send privacy requests to the email above.","policy.intro":"We value your privacy. This policy explains which information Sudoku uses and why.","policy.local":"1. Game data\nWe save game progress, results and settings on your device to retain your play records and provide a normal gaming experience.","policy.google":"2. Accounts and cloud saves\nGoogle Play Games processes player IDs, display names, avatars, ranks and results for account identification, profiles and leaderboards. These details may be visible to other players under Google's privacy settings.\n\nWhen you use cloud saves, progress, results, completion records, unfinished games and necessary sync identifiers are stored through Google Play Games Saved Games for restoration and cross-device sync. Local settings and privacy choices are not synced. Signing out does not automatically delete these records.","policy.ads":"3. Advertising services\nWe use Google AdMob to provide rewarded ads that you choose to watch. Advertising services may process your IP address and approximate location inferred from it, device and app information, device or account identifiers (including advertising identifiers), interaction records and diagnostics to display ads, measure performance and prevent fraud. Advertising consent is handled separately according to regional requirements.","policy.telemetry":"4. Analytics, error reports and configuration\nIf you separately enable them, Firebase Analytics and Crashlytics process app usage, device and system information, app versions, installation identifiers and error records to understand usage and improve stability. You can withdraw each choice in Settings; optional collection is not required to play. Fully disabling native error reporting may require an app restart.\n\nWhen enabled, Firebase Remote Config may process installation identifiers to supply app configuration.","policy.rights":"5. Retention and data management\nLocal data remains until overwritten or cleared through device settings; system backups follow system rules. Cloud saves and rankings are retained to provide account services and can be subject to deletion requests. Analytics details follow the service's configured retention and cleanup cycles and are kept only as needed for analysis and improvement; aggregated reports may remain longer. Crashlytics normally starts removing related error records and identifiers from live and backup systems after 90 days. Other service identifiers follow the respective service rules.\n\nYou can withdraw analytics and error-reporting consent in Settings and manage relevant records through Google's account or game data controls. Uninstalling, clearing local data or signing out does not delete all cloud or third-party records; withdrawing consent does not automatically delete data already lawfully processed.\n\nEmail the contact above to request access, correction, export or deletion of data we control. We request only necessary identity verification and respond within applicable legal deadlines. We handle requests for data processed on our behalf under applicable rules; independently managed Google account data uses Google's controls. Legally required retention is limited in purpose and explained.","policy.changes":"8. Minors and policy changes\nThis game is intended for users aged 16 and over, not specifically for children. Users below the local age for valid independent data-processing consent must obtain legally required guardian consent. Guardians may report missing authorization to the email above; we will investigate and take legally required steps to stop processing, delete data or provide other necessary remedies.\n\nFor material changes, we update this policy and provide notice or request renewed consent as legally required. The policy is available in the game and on the public website.","policy.draft":"Review draft: operator name, contact email and public URL will be added before release.","policy.contact":"Developer / brand: {brand}\nOperator: {operator}\nPrivacy contact: {email}"}},"ja":{"name":"日本語","messages":{"policy.title":"プライバシーポリシー","policy.choice":"ポリシーを読み、同意するかお選びください。","policy.reject":"同意しない","policy.accept":"同意して開始","policy.rejected":"開始には同意が必要です。ゲームを終了できます。","policy.saveFailed":"選択を保存できませんでした。再試行してください。","policy.updated":"更新日：{date}","policy.security":"6. 提供事業者、安全性、国外処理\nGoogle Play Games、AdMob、Firebase などを利用し、合理的なアクセス制御と安全対策を講じます。法的義務、紛争解決、正当な権利の保護のため、必要な情報を提供する場合があります。\n\n事業者が国外で処理する場合、適用される十分性認定、標準契約条項など、法的に認められた保護措置を使用します。詳細はお問い合わせください。政策のウェブページは GitHub Pages で公開され、GitHub は安全のため閲覧者の IP アドレスを処理することがあります。","policy.regions":"7. 地域ごとの補足と権利\n欧州経済領域と英国：必要なアカウントとクラウドセーブの処理は、ご希望のサービスの提供に基づきます。任意の分析とエラー報告は同意に基づきます。安全と不正利用防止の必要な処理は、法律で認められ、お客様の権利と衡量した正当な利益に基づく場合があります。広告の同意は別途扱います。適用法により、閲覧、訂正、削除、処理の制限・異議、データの移転、同意の撤回、現地監督機関への申立て等の権利があります。撤回はそれ以前の適法な処理に影響しません。\n\n米国の適用地域：現地法により、個人情報の把握、閲覧、訂正、削除、法律上の販売・共有・ターゲティング広告に当たる処理の拒否と、不法な差別を受けない権利が認められる場合があります。\n\nその他の地域では適用される現地法に従います。表示言語ではなく法律の適用範囲により判断します。申請は上記メールへお送りください。","policy.intro":"私たちはお客様のプライバシーを尊重します。本ポリシーは、Sudoku が使用する情報とその目的を説明します。","policy.local":"1. ゲームデータ\nプレイ記録を保持し、通常のゲーム体験を提供するため、ゲームの進行状況、成績、設定をお客様の端末に保存します。","policy.google":"2. アカウントとクラウドセーブ\nGoogle Play Games は、アカウントの識別、プロフィール、ランキングのため、プレイヤー ID、表示名、アバター、順位、成績を処理します。情報は Google のプライバシー設定に従って他のプレイヤーに表示されることがあります。\n\nクラウドセーブを利用すると、進捗、成績、完了記録、未完了のゲーム、必要な同期識別子が Google Play Games Saved Games に保存され、復元と端末間の同期に使われます。端末の設定とプライバシーの選択は同期されません。ログアウトしても記録は自動的に削除されません。","policy.ads":"3. 広告サービス\nGoogle AdMob を使用し、お客様が任意で視聴するリワード広告を提供します。広告サービスは、広告の表示、効果測定、不正防止のため、IP アドレスとそこから推定されるおおよその位置、端末やアプリの情報、端末またはアカウントの識別子（広告識別子を含む）、操作記録、診断情報を処理することがあります。広告に関する同意は、地域の要件に従って別途取り扱います。","policy.telemetry":"4. 分析、エラー報告、動作設定\n個別に有効化した場合、Firebase Analytics と Crashlytics がアプリの利用状況、端末とシステムの情報、アプリのバージョン、インストール識別子、エラー記録を処理し、利用状況の把握と安定性の改善に使います。設定でそれぞれ撤回でき、任意の収集を拒否しても遊べます。ネイティブのエラー報告を完全に停止するには再起動が必要な場合があります。\n\nFirebase Remote Config を有効化すると、アプリの動作設定を提供するためにインストール識別子を処理することがあります。","policy.rights":"5. 保存期間とデータ管理\n端末のデータは上書きまたは端末設定からの消去まで保持され、システムのバックアップはシステムの規則に従います。クラウドセーブとランキングはアカウントサービスのため保持され、所定の手順で削除を申請できます。分析の詳細データはサービスで設定した期間と削除周期に従い、分析と改善に必要な範囲でのみ保持されます。集計レポートはより長く残ることがあります。Crashlytics は通常、関連するエラー記録と識別子を 90 日間保持した後、稼働中およびバックアップのシステムからの削除を開始します。他のサービス識別子は各サービスの規則に従います。\n\n設定で分析とエラー報告への同意を撤回でき、Google のアカウントやゲームデータの管理機能で関連記録を管理できます。アンインストール、端末データの消去、ログアウトでは、クラウドや第三者の全記録は削除されません。同意の撤回も、既に適法に処理したデータを自動削除しません。\n\n当方が管理するデータの閲覧、訂正、書き出し、削除は上記メールに申請してください。必要な本人確認のみを求め、適用法の期限内に回答します。委託先が当方に代わって処理するデータの申請は当方が規則に従い対応します。Google が独立管理するアカウント情報は Google の窓口で管理します。法的に保存が必要な情報は用途を制限し、理由を説明します。","policy.changes":"8. 未成年者と政策の変更\n本ゲームは 16 歳以上を対象とし、子ども向けに特化したものではありません。所在地でデータ処理に単独で有効に同意できる年齢に満たない場合、法律に従い保護者の有効な同意が必要です。必要な同意が欠けていると考える保護者は上記メールへご連絡ください。確認し、法律に従い処理の停止、削除など必要な措置を取ります。\n\n重要な変更時は政策を更新し、法律に従い通知または再同意を求めます。ゲーム内と公開ウェブページで確認できます。","policy.draft":"確認用草案：運営者、連絡メール、公開 URL はリリース前に追記します。","policy.contact":"開発者／ブランド：{brand}\n運営主体：{operator}\nプライバシー連絡先：{email}"}},"ko":{"name":"한국어","messages":{"policy.title":"개인정보 처리방침","policy.choice":"방침을 읽고 동의 여부를 선택하세요.","policy.reject":"동의 안 함","policy.accept":"동의하고 시작","policy.rejected":"시작하려면 동의가 필요합니다. 게임을 종료할 수 있습니다.","policy.saveFailed":"선택을 저장하지 못했습니다. 다시 시도하세요.","policy.updated":"업데이트 날짜: {date}","policy.security":"6. 서비스 제공자, 보안과 국외 처리\nGoogle Play Games, AdMob, Firebase 등의 서비스를 사용하며 합리적인 접근 통제와 보안 조치를 적용합니다. 법적 의무 이행, 분쟁 해결 또는 정당한 권리 보호를 위해 필요한 정보를 제공할 수 있습니다.\n\n제공자는 거주 지역 밖에서 데이터를 처리할 수 있으며, 적용되는 경우 적정성 결정, 표준계약조항 등 법적으로 인정되는 보호 조치를 이용합니다. 자세한 내용은 문의해 주세요. 정책 웹페이지는 GitHub Pages로 호스팅하며 GitHub는 보안을 위해 방문자의 IP 주소를 처리할 수 있습니다.","policy.regions":"7. 지역별 보충 사항과 권리\n유럽경제지역과 영국: 필요한 계정 및 클라우드 저장 처리는 요청한 서비스 제공을 근거로 하며, 선택적 통계 및 오류 보고는 동의를 근거로 합니다. 필요한 보안 및 오용 방지 처리는 법이 허용하고 이용자의 권리와 비교·형량한 정당한 이익에 근거할 수 있습니다. 광고 동의는 별도로 처리합니다. 관련 법에 따라 열람, 정정, 삭제, 처리 제한·반대, 데이터 이동, 동의 철회 및 현지 감독기관에 대한 불만 제기 등의 권리가 있습니다. 철회는 이전의 적법한 처리에 영향을 주지 않습니다.\n\n미국 내 적용 지역: 현지 법률에 따라 개인정보 확인, 열람, 정정, 삭제 및 법률상 판매·공유·맞춤형 광고에 해당하는 처리 거부와 불법적인 차별을 받지 않을 권리가 있을 수 있습니다.\n\n다른 지역은 해당 현지 법률의 데이터 권리를 적용합니다. 적용 범위는 화면 언어가 아닌 법률로 판단합니다. 개인정보 요청은 위 이메일로 보내 주세요.","policy.intro":"당사는 귀하의 개인정보를 소중히 여깁니다. 본 방침은 Sudoku가 어떤 정보를 사용하고 어떤 목적으로 사용하는지 설명합니다.","policy.local":"1. 게임 데이터\n플레이 기록을 유지하고 정상적인 게임 경험을 제공하기 위해 게임 진행 상황, 결과 및 설정을 귀하의 기기에 저장합니다.","policy.google":"2. 계정과 클라우드 저장\nGoogle Play Games는 계정 식별, 프로필 표시 및 순위표 제공을 위해 플레이어 ID, 표시 이름, 아바타, 순위와 성적을 처리합니다. 관련 정보는 Google 개인정보 설정에 따라 다른 플레이어에게 표시될 수 있습니다.\n\n클라우드 저장을 사용하면 진행 상황, 성적, 완료 기록, 미완료 게임과 필요한 동기화 식별자가 Google Play Games Saved Games에 저장되어 복원과 기기 간 동기화에 사용됩니다. 기기 설정과 개인정보 선택은 동기화되지 않습니다. 로그아웃해도 이 기록은 자동 삭제되지 않습니다.","policy.ads":"3. 광고 서비스\nGoogle AdMob을 사용하여 귀하가 자발적으로 시청하는 보상형 광고를 제공합니다. 광고 서비스는 광고 표시, 효과 측정 및 부정행위 방지를 위해 IP 주소와 이를 통해 추정한 대략적인 위치, 기기 및 앱 정보, 기기 또는 계정 식별자(광고 식별자 포함), 상호작용 기록 및 진단 정보를 처리할 수 있습니다. 광고 관련 동의는 지역별 요구사항에 따라 별도로 처리됩니다.","policy.telemetry":"4. 통계, 오류 보고와 실행 설정\n각 서비스를 별도로 활성화하면 Firebase Analytics와 Crashlytics가 앱 사용 현황, 기기 및 시스템 정보, 앱 버전, 설치 식별자와 오류 기록을 처리하여 사용 현황을 파악하고 안정성을 개선합니다. 설정에서 각각 철회할 수 있으며, 선택적 수집을 거부해도 플레이할 수 있습니다. 네이티브 오류 보고를 완전히 끄려면 앱 재시작이 필요할 수 있습니다.\n\nFirebase Remote Config를 활성화하면 앱 실행 설정 제공을 위해 설치 식별자를 처리할 수 있습니다.","policy.rights":"5. 보관 기간과 데이터 관리\n기기 데이터는 덮어쓰거나 기기 설정에서 삭제할 때까지 보관하며, 시스템 백업은 시스템 규칙을 따릅니다. 클라우드 저장과 순위 기록은 계정 서비스 제공을 위해 보관하며 해당 절차로 삭제를 요청할 수 있습니다. 통계 상세 데이터는 분석 서비스의 보관 설정과 삭제 주기를 따르고 분석 및 개선에 필요한 범위에서만 보관합니다. 집계 보고서는 더 오래 남을 수 있습니다. Crashlytics는 일반적으로 관련 오류 기록과 식별자를 90일간 보관한 뒤 운영 및 백업 시스템에서 삭제를 시작합니다. 다른 서비스 식별자는 해당 서비스 규칙을 따릅니다.\n\n설정에서 통계 및 오류 보고 동의를 철회하고 Google의 계정 또는 게임 데이터 관리 기능으로 관련 기록을 관리할 수 있습니다. 앱 삭제, 기기 데이터 삭제 또는 로그아웃은 모든 클라우드 및 제3자 기록의 삭제를 의미하지 않습니다. 동의 철회도 적법하게 처리된 기존 데이터를 자동 삭제하지 않습니다.\n\n당사가 관리하는 데이터의 열람, 정정, 내보내기 또는 삭제는 위 이메일로 요청해 주세요. 필요한 본인 확인 정보만 요구하고 관련 법률의 기한 내에 답변합니다. 당사를 대신하여 서비스 제공자가 처리하는 데이터 요청은 당사가 관련 규칙에 따라 처리합니다. Google이 독립적으로 관리하는 계정 정보는 Google의 해당 기능으로 관리합니다. 법적으로 보관이 필요한 정보는 용도를 제한하고 이유를 안내합니다.","policy.changes":"8. 미성년자와 정책 변경\n본 게임은 16세 이상을 대상으로 하며 아동 전용으로 설계되지 않았습니다. 현지에서 데이터 처리에 독립적으로 유효한 동의를 할 수 있는 연령 미만인 경우 법에서 요구하는 보호자의 유효한 동의를 받아야 합니다. 필요한 동의가 없는 처리가 있다고 생각하는 보호자는 위 이메일로 연락해 주세요. 확인 후 법에 따라 처리 중단, 삭제 등 필요한 조치를 취합니다.\n\n중요한 처리 방식 변경 시 정책을 업데이트하고 법에 따라 알리거나 필요한 동의를 다시 요청합니다. 게임과 공개 웹페이지에서 정책을 볼 수 있습니다.","policy.draft":"검토 초안: 운영자, 연락 이메일, 공개 URL은 출시 전에 추가합니다.","policy.contact":"개발자 / 브랜드: {brand}\n운영 주체: {operator}\n개인정보 문의: {email}"}},"fr":{"name":"Français","messages":{"policy.title":"Politique de confidentialité","policy.choice":"Veuillez lire la politique et choisir de l’accepter ou non.","policy.reject":"Refuser","policy.accept":"Accepter et jouer","policy.rejected":"Votre accord est requis. Vous pouvez fermer le jeu.","policy.saveFailed":"Échec de sauvegarde. Réessayez.","policy.updated":"Dernière mise à jour : {date}","policy.security":"6. Prestataires, sécurité et transferts internationaux\nNous utilisons notamment Google Play Games, AdMob et Firebase et prenons des mesures raisonnables de sécurité et de contrôle d'accès. Des informations nécessaires peuvent être communiquées pour respecter la loi, résoudre des litiges ou protéger des droits légitimes.\n\nLes prestataires peuvent traiter les données hors de votre région, avec une décision d'adéquation, des clauses contractuelles types ou d'autres garanties légales, le cas échéant. Contactez-nous pour plus de détails. Le site utilise GitHub Pages ; GitHub peut traiter les adresses IP des visiteurs pour la sécurité.","policy.regions":"7. Dispositions régionales et droits\nEEE et Royaume-Uni : le traitement nécessaire aux comptes et sauvegardes permet d'exécuter le service demandé ; statistiques et rapports d'erreur facultatifs reposent sur le consentement. La sécurité et la prévention des abus peuvent reposer sur l'intérêt légitime lorsque la loi le permet, après mise en balance avec vos droits. Le consentement publicitaire est distinct. Les droits applicables incluent accès, rectification, effacement, limitation, opposition, portabilité, retrait du consentement et réclamation auprès de l'autorité locale. Le retrait n'affecte pas la licéité du traitement antérieur.\n\nRégions américaines concernées : la loi locale peut permettre de connaître, consulter, rectifier ou supprimer les données, et de refuser un traitement qualifié de vente, partage ou publicité ciblée, sans discrimination illégale.\n\nAilleurs, les droits prévus par la loi locale s'appliquent. L'applicabilité juridique, non la langue de l'interface, détermine les règles. Adressez vos demandes à l'adresse ci-dessus.","policy.intro":"Nous respectons votre vie privée. Cette politique explique quelles informations Sudoku utilise et à quelles fins.","policy.local":"1. Données de jeu\nNous enregistrons la progression, les résultats et les paramètres sur votre appareil pour conserver vos données de jeu et assurer une expérience normale.","policy.google":"2. Comptes et sauvegardes cloud\nGoogle Play Games traite l'identifiant, le pseudonyme, l'avatar, le rang et les résultats pour identifier le compte, afficher le profil et fournir les classements. Ces informations peuvent être visibles selon les paramètres de confidentialité Google.\n\nAvec la sauvegarde cloud, la progression, les résultats, les réussites, les parties inachevées et les identifiants de synchronisation nécessaires sont conservés via Google Play Games Saved Games pour la restauration et la synchronisation entre appareils. Les réglages locaux et les choix de confidentialité ne sont pas synchronisés. La déconnexion ne supprime pas automatiquement ces données.","policy.ads":"3. Services publicitaires\nNous utilisons Google AdMob pour proposer des publicités avec récompense que vous choisissez de regarder. Ces services peuvent traiter votre adresse IP et la localisation approximative qui en est déduite, des informations sur l'appareil et l'application, des identifiants d'appareil ou de compte (dont les identifiants publicitaires), des interactions et des diagnostics afin d'afficher des publicités, de mesurer leur efficacité et de prévenir la fraude. Le consentement publicitaire est traité séparément selon les exigences régionales.","policy.telemetry":"4. Statistiques, erreurs et configuration\nSi vous les activez séparément, Firebase Analytics et Crashlytics traitent l'utilisation de l'application, les informations de l'appareil et du système, les versions, les identifiants d'installation et les erreurs pour comprendre l'utilisation et améliorer la stabilité. Chaque choix peut être retiré dans les paramètres ; la collecte facultative n'est pas nécessaire pour jouer. L'arrêt complet des rapports d'erreur natifs peut nécessiter un redémarrage.\n\nLorsqu'il est activé, Firebase Remote Config peut traiter des identifiants d'installation pour fournir la configuration de l'application.","policy.rights":"5. Conservation et gestion des données\nLes données locales restent jusqu'à leur remplacement ou effacement dans les réglages de l'appareil ; les sauvegardes système suivent ses règles. Les sauvegardes cloud et classements sont conservés pour le service de compte et peuvent faire l'objet d'une demande de suppression. Les données statistiques détaillées suivent la durée et les cycles de nettoyage configurés, uniquement selon les besoins d'analyse et d'amélioration ; les rapports agrégés peuvent rester plus longtemps. Crashlytics commence normalement à supprimer les erreurs et identifiants associés des systèmes actifs et de sauvegarde après 90 jours. Les autres identifiants suivent les règles du service concerné.\n\nVous pouvez retirer le consentement aux statistiques et rapports d'erreur dans les paramètres et gérer les enregistrements via les outils Google. Désinstaller, effacer les données locales ou se déconnecter ne supprime pas toutes les données cloud ou tierces. Le retrait du consentement ne supprime pas automatiquement les données déjà traitées licitement.\n\nÉcrivez à l'adresse ci-dessus pour demander l'accès, la rectification, l'exportation ou la suppression des données sous notre contrôle. Nous demandons seulement la vérification d'identité nécessaire et répondons dans les délais légaux applicables. Nous traitons les demandes concernant nos prestataires selon les règles applicables ; les données de compte gérées indépendamment par Google se gèrent auprès de Google. Toute conservation légalement requise est limitée et expliquée.","policy.changes":"8. Mineurs et modifications\nLe jeu vise les personnes de 16 ans et plus et n'est pas spécifiquement destiné aux enfants. En dessous de l'âge local permettant un consentement autonome valable, l'accord du représentant légal requis par la loi est nécessaire. Les représentants peuvent signaler un défaut d'autorisation à l'adresse ci-dessus ; nous vérifierons et prendrons les mesures légales nécessaires, notamment l'arrêt du traitement ou la suppression.\n\nEn cas de modification importante, nous actualisons la politique et vous informons ou sollicitons un nouveau consentement conformément à la loi. Elle est disponible dans le jeu et sur le site public.","policy.draft":"Projet à valider : opérateur, courriel et URL publique seront ajoutés avant publication.","policy.contact":"Développeur / marque : {brand}\nExploitant : {operator}\nContact confidentialité : {email}"}},"de":{"name":"Deutsch","messages":{"policy.title":"Datenschutzerklärung","policy.choice":"Bitte lesen Sie die Erklärung und entscheiden Sie, ob Sie zustimmen.","policy.reject":"Ablehnen","policy.accept":"Zustimmen & starten","policy.rejected":"Zum Start ist Zustimmung nötig. Sie können das Spiel schließen.","policy.saveFailed":"Speichern fehlgeschlagen. Bitte erneut versuchen.","policy.updated":"Zuletzt aktualisiert: {date}","policy.security":"6. Dienstleister, Sicherheit und internationale Verarbeitung\nWir nutzen unter anderem Google Play Games, AdMob und Firebase und treffen angemessene Zugriffs- und Sicherheitsmaßnahmen. Erforderliche Angaben können zur Erfüllung gesetzlicher Pflichten, Streitbeilegung oder Wahrung berechtigter Rechte übermittelt werden.\n\nDienstleister können Daten außerhalb Ihrer Region verarbeiten, gegebenenfalls auf Basis von Angemessenheitsbeschlüssen, Standardvertragsklauseln oder anderen anerkannten Garantien. Einzelheiten erhalten Sie auf Anfrage. Die Richtlinienseite nutzt GitHub Pages; GitHub kann Besucher-IP-Adressen zu Sicherheitszwecken verarbeiten.","policy.regions":"7. Regionale Ergänzungen und Rechte\nEWR und Vereinigtes Königreich: Nötige Konto- und Cloud-Verarbeitung dient der Erfüllung der angeforderten Dienste; freiwillige Statistik und Fehlerberichte beruhen auf Einwilligung. Erforderliche Sicherheit und Missbrauchsprävention können, soweit zulässig und mit Ihren Rechten abgewogen, auf berechtigten Interessen beruhen. Werbeeinwilligungen werden gesondert behandelt. Zu den geltenden Rechten zählen Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch, Übertragbarkeit, Widerruf und Beschwerden bei örtlichen Aufsichtsbehörden. Ein Widerruf berührt frühere rechtmäßige Verarbeitung nicht.\n\nAnwendbare US-Regionen: Örtliche Gesetze können Informations-, Zugangs-, Berichtigungs- und Löschrechte sowie den Ausstieg aus gesetzlich als Verkauf, Weitergabe oder gezielte Werbung eingestufter Verarbeitung ohne unzulässige Benachteiligung gewähren.\n\nAndernorts gelten die örtlichen Datenschutzrechte. Maßgeblich ist der gesetzliche Geltungsbereich, nicht die Oberflächensprache. Anträge richten Sie an die obige Adresse.","policy.intro":"Wir achten Ihre Privatsphäre. Diese Richtlinie erläutert, welche Informationen Sudoku verwendet und zu welchem Zweck.","policy.local":"1. Spieldaten\nWir speichern Spielfortschritt, Ergebnisse und Einstellungen auf Ihrem Gerät, um Ihre Spielaufzeichnungen zu erhalten und ein normales Spielerlebnis zu ermöglichen.","policy.google":"2. Konten und Cloud-Spielstände\nGoogle Play Games verarbeitet Spieler-ID, Anzeigename, Avatar, Rang und Ergebnisse für Kontoerkennung, Profile und Ranglisten. Diese Angaben können gemäß den Google-Datenschutzeinstellungen für andere Spieler sichtbar sein.\n\nBei Cloud-Spielständen werden Fortschritt, Ergebnisse, Abschlussnachweise, offene Spiele und nötige Synchronisierungskennungen über Google Play Games Saved Games zur Wiederherstellung und geräteübergreifenden Synchronisierung gespeichert. Lokale Einstellungen und Datenschutzentscheidungen werden nicht synchronisiert. Abmelden löscht diese Daten nicht automatisch.","policy.ads":"3. Werbedienste\nWir verwenden Google AdMob für freiwillig angesehene Anzeigen mit Belohnung. Werbedienste können Ihre IP-Adresse und den daraus abgeleiteten ungefähren Standort, Geräte- und App-Informationen, Geräte- oder Kontokennungen (einschließlich Werbekennungen), Interaktionen und Diagnosedaten verarbeiten. Dies dient der Anzeige von Werbung, der Erfolgsmessung und der Betrugsprävention. Die Werbeeinwilligung wird gemäß den regionalen Anforderungen gesondert behandelt.","policy.telemetry":"4. Statistik, Fehlerberichte und Konfiguration\nWenn Sie die Dienste einzeln aktivieren, verarbeiten Firebase Analytics und Crashlytics App-Nutzung, Geräte- und Systeminformationen, App-Versionen, Installationskennungen und Fehlerberichte zur Nutzungsanalyse und Verbesserung der Stabilität. Jede Entscheidung kann in den Einstellungen widerrufen werden; die freiwillige Erfassung ist zum Spielen nicht erforderlich. Für das vollständige Abschalten nativer Fehlerberichte kann ein Neustart nötig sein.\n\nWenn Firebase Remote Config aktiviert ist, kann es Installationskennungen für die Bereitstellung von App-Konfigurationen verarbeiten.","policy.rights":"5. Speicherung und Datenverwaltung\nLokale Daten bleiben bis zum Überschreiben oder Löschen in den Geräteeinstellungen; Systembackups folgen den Systemregeln. Cloud-Spielstände und Ranglisten werden für Kontodienste gespeichert und können Gegenstand von Löschanträgen sein. Statistikdetails folgen den konfigurierten Fristen und Löschzyklen und bleiben nur so lange wie für Analyse und Verbesserung nötig; zusammengefasste Berichte können länger bestehen. Crashlytics beginnt normalerweise nach 90 Tagen mit der Löschung zugehöriger Fehlerdaten und Kennungen aus aktiven und Sicherungssystemen. Andere Kennungen folgen den Regeln des jeweiligen Dienstes.\n\nSie können Statistik- und Fehlerberichtseinwilligungen in den Einstellungen widerrufen und Daten über Googles Konto- oder Spieldatenverwaltung verwalten. Deinstallation, lokales Löschen oder Abmelden löscht nicht alle Cloud- und Drittdaten. Ein Widerruf löscht zuvor rechtmäßig verarbeitete Daten nicht automatisch.\n\nFür Auskunft, Berichtigung, Export oder Löschung der von uns kontrollierten Daten schreiben Sie an die obige E-Mail-Adresse. Wir verlangen nur nötige Identitätsnachweise und antworten innerhalb geltender gesetzlicher Fristen. Für Daten, die Dienstleister in unserem Auftrag verarbeiten, bearbeiten wir Anträge nach geltenden Regeln. Unabhängig von Google verwaltete Kontodaten werden bei Google verwaltet. Gesetzlich erforderliche Speicherung wird zweckgebunden begrenzt und erklärt.","policy.changes":"8. Minderjährige und Änderungen\nDas Spiel richtet sich an Personen ab 16 Jahren und nicht speziell an Kinder. Wer das örtliche Alter für eine eigenständige wirksame Einwilligung nicht erreicht, benötigt die gesetzlich erforderliche Zustimmung eines Erziehungsberechtigten. Erziehungsberechtigte können fehlende Zustimmung an die obige Adresse melden. Wir prüfen dies und ergreifen erforderliche rechtliche Maßnahmen, etwa das Einstellen der Verarbeitung oder die Löschung.\n\nBei wesentlichen Änderungen aktualisieren wir die Richtlinie und informieren Sie oder holen nötige neue Einwilligungen ein. Sie ist im Spiel und auf der öffentlichen Webseite verfügbar.","policy.draft":"Prüfentwurf: Betreiber, E-Mail und öffentliche URL werden vor Veröffentlichung ergänzt.","policy.contact":"Entwickler / Marke: {brand}\nBetreiber: {operator}\nDatenschutzkontakt: {email}"}},"es":{"name":"Español","messages":{"policy.title":"Política de privacidad","policy.choice":"Lee la política y elige si la aceptas.","policy.reject":"Rechazar","policy.accept":"Aceptar y jugar","policy.rejected":"Se requiere aceptación para entrar. Puedes cerrar el juego.","policy.saveFailed":"No se pudo guardar. Inténtalo otra vez.","policy.updated":"Última actualización: {date}","policy.security":"6. Proveedores, seguridad y transferencias\nUsamos servicios como Google Play Games, AdMob y Firebase y aplicamos medidas razonables de seguridad y control de acceso. Podemos comunicar información necesaria para cumplir la ley, resolver disputas o proteger derechos legítimos.\n\nLos proveedores pueden tratar datos fuera de tu región utilizando, cuando corresponda, decisiones de adecuación, cláusulas contractuales tipo u otras garantías legales. Contacta para más información. La web utiliza GitHub Pages; GitHub puede tratar las direcciones IP de visitantes por seguridad.","policy.regions":"7. Disposiciones regionales y derechos\nEEE y Reino Unido: el tratamiento necesario de cuentas y guardados permite prestar el servicio solicitado; las estadísticas e informes opcionales se basan en el consentimiento. La seguridad y prevención de abusos necesarias pueden basarse en intereses legítimos cuando sea legal, ponderando tus derechos. El consentimiento publicitario se gestiona por separado. Los derechos aplicables incluyen acceso, rectificación, supresión, limitación, oposición, portabilidad, retirada del consentimiento y reclamación ante el regulador local. La retirada no afecta al tratamiento lícito previo.\n\nRegiones de EE. UU. aplicables: la ley local puede permitir conocer, acceder, corregir o borrar información y excluir el tratamiento considerado venta, intercambio o publicidad dirigida, sin discriminación ilegal.\n\nEn otras regiones se aplican los derechos locales correspondientes. Las reglas dependen del ámbito legal, no del idioma de la interfaz. Envía solicitudes al correo anterior.","policy.intro":"Respetamos su privacidad. Esta política explica qué información utiliza Sudoku y para qué.","policy.local":"1. Datos del juego\nGuardamos el progreso, los resultados y los ajustes en su dispositivo para conservar sus registros de juego y ofrecer una experiencia normal.","policy.google":"2. Cuentas y guardado en la nube\nGoogle Play Games trata el ID, nombre visible, avatar, posición y resultados para identificar cuentas, mostrar perfiles y ofrecer clasificaciones. Estos datos pueden ser visibles según los ajustes de privacidad de Google.\n\nAl usar el guardado en la nube, el progreso, resultados, registros de finalización, partidas pendientes e identificadores necesarios se guardan mediante Google Play Games Saved Games para recuperar y sincronizar entre dispositivos. Los ajustes locales y decisiones de privacidad no se sincronizan. Cerrar sesión no elimina estos registros automáticamente.","policy.ads":"3. Servicios publicitarios\nUtilizamos Google AdMob para ofrecer anuncios con recompensa que usted decide ver. Los servicios publicitarios pueden tratar su dirección IP y la ubicación aproximada deducida de ella, información del dispositivo y de la aplicación, identificadores de dispositivo o cuenta (incluidos los publicitarios), registros de interacción y diagnósticos para mostrar anuncios, medir su rendimiento y prevenir el fraude. El consentimiento publicitario se gestiona por separado según los requisitos regionales.","policy.telemetry":"4. Estadísticas, errores y configuración\nSi los activas por separado, Firebase Analytics y Crashlytics tratan el uso de la aplicación, información del dispositivo y sistema, versiones, identificadores de instalación y errores para entender el uso y mejorar la estabilidad. Puedes retirar cada elección en Ajustes; la recopilación opcional no es necesaria para jugar. Desactivar por completo los informes nativos puede requerir reiniciar la aplicación.\n\nCuando se activa, Firebase Remote Config puede tratar identificadores de instalación para proporcionar la configuración de la aplicación.","policy.rights":"5. Conservación y gestión de datos\nLos datos locales permanecen hasta que se sobrescriben o borran en los ajustes del dispositivo; las copias del sistema siguen sus reglas. Los guardados en la nube y clasificaciones se conservan para el servicio de cuenta y pueden ser objeto de solicitudes de eliminación. Los detalles estadísticos siguen el plazo y los ciclos de limpieza configurados y se conservan solo mientras sean necesarios para analizar y mejorar; los informes agregados pueden durar más. Crashlytics normalmente empieza a eliminar errores e identificadores de los sistemas activos y de respaldo después de 90 días. Otros identificadores siguen las reglas del servicio correspondiente.\n\nPuedes retirar el consentimiento a estadísticas y errores en Ajustes y gestionar registros con las herramientas de Google. Desinstalar, borrar datos locales o cerrar sesión no elimina todos los datos en la nube o de terceros. Retirar el consentimiento tampoco elimina automáticamente datos tratados lícitamente.\n\nEscribe al correo anterior para solicitar acceso, rectificación, exportación o eliminación de datos bajo nuestro control. Pedimos solo la verificación de identidad necesaria y respondemos en los plazos legales. Tramitamos conforme a las reglas las solicitudes sobre datos procesados por proveedores en nuestro nombre. Los datos de cuenta gestionados independientemente por Google se gestionan en Google. La conservación exigida por ley se limita en finalidad y se explica.","policy.changes":"8. Menores y cambios\nEl juego se dirige a personas de 16 años o más y no específicamente a niños. Por debajo de la edad local para consentir válidamente de forma independiente, se requiere el consentimiento del tutor exigido por ley. Los tutores pueden informar de autorizaciones ausentes al correo anterior; investigaremos y tomaremos las medidas legales necesarias, como detener el tratamiento o borrar datos.\n\nAnte cambios importantes actualizamos la política y notificamos o solicitamos un nuevo consentimiento cuando la ley lo exige. Está disponible en el juego y en la web pública.","policy.draft":"Borrador: operador, correo y URL pública se añadirán antes de publicar.","policy.contact":"Desarrollador / marca: {brand}\nOperador: {operator}\nContacto de privacidad: {email}"}},"pt-BR":{"name":"Português (Brasil)","messages":{"policy.title":"Política de privacidade","policy.choice":"Leia a política e escolha se deseja aceitá-la.","policy.reject":"Recusar","policy.accept":"Aceitar e jogar","policy.rejected":"É preciso aceitar para entrar. Você pode fechar o jogo.","policy.saveFailed":"Não foi possível salvar. Tente novamente.","policy.updated":"Última atualização: {date}","policy.security":"6. Prestadores, segurança e transferências\nUsamos serviços como Google Play Games, AdMob e Firebase e aplicamos controles de acesso e segurança razoáveis. Informações necessárias podem ser fornecidas para cumprir a lei, resolver disputas ou proteger direitos legítimos.\n\nPrestadores podem tratar dados fora da sua região, usando decisões de adequação, cláusulas contratuais padrão ou outras garantias legais quando aplicável. Entre em contato para detalhes. O site usa GitHub Pages; o GitHub pode tratar IPs de visitantes para segurança.","policy.regions":"7. Regras regionais e direitos\nEEE e Reino Unido: o tratamento necessário de contas e salvamentos presta o serviço solicitado; estatísticas e erros opcionais dependem de consentimento. Segurança e prevenção de abuso necessárias podem se basear em interesses legítimos quando permitido, ponderando seus direitos. O consentimento publicitário é separado. Direitos aplicáveis incluem acesso, correção, exclusão, restrição, oposição, portabilidade, retirada do consentimento e reclamação ao órgão local. A retirada não afeta o tratamento legal anterior.\n\nRegiões dos EUA aplicáveis: a lei local pode garantir conhecimento, acesso, correção e exclusão, além de recusa ao tratamento classificado como venda, compartilhamento ou publicidade direcionada, sem discriminação ilegal.\n\nEm outras regiões, valem os direitos da legislação local aplicável. As regras dependem do alcance da lei, não do idioma da interface. Envie pedidos ao e-mail acima.","policy.intro":"Respeitamos sua privacidade. Esta política explica quais informações o Sudoku utiliza e para quais finalidades.","policy.local":"1. Dados do jogo\nSalvamos o progresso, os resultados e as configurações no seu dispositivo para manter seus registros de jogo e oferecer uma experiência normal.","policy.google":"2. Contas e salvamento na nuvem\nO Google Play Games trata ID, nome público, avatar, posição e resultados para identificar contas, mostrar perfis e fornecer rankings. Essas informações podem ser visíveis conforme as configurações de privacidade do Google.\n\nAo usar a nuvem, progresso, resultados, registros de conclusão, partidas pendentes e identificadores necessários são armazenados pelo Google Play Games Saved Games para recuperação e sincronização entre dispositivos. Configurações locais e escolhas de privacidade não são sincronizadas. Sair da conta não apaga automaticamente esses registros.","policy.ads":"3. Serviços de publicidade\nUsamos o Google AdMob para oferecer anúncios com recompensa que você escolhe assistir. Os serviços de publicidade podem processar seu endereço IP e a localização aproximada inferida dele, informações do dispositivo e do aplicativo, identificadores de dispositivo ou conta (incluindo identificadores de publicidade), registros de interação e diagnósticos para exibir anúncios, medir resultados e prevenir fraudes. O consentimento para publicidade é tratado separadamente conforme os requisitos regionais.","policy.telemetry":"4. Estatísticas, erros e configuração\nSe você ativar separadamente, Firebase Analytics e Crashlytics tratam uso do aplicativo, informações do dispositivo e sistema, versões, identificadores de instalação e erros para entender o uso e melhorar a estabilidade. Cada escolha pode ser retirada nas Configurações; a coleta opcional não é necessária para jogar. Desativar totalmente os relatórios nativos pode exigir reiniciar o aplicativo.\n\nQuando ativado, Firebase Remote Config pode tratar identificadores de instalação para fornecer configurações do aplicativo.","policy.rights":"5. Retenção e gestão de dados\nDados locais ficam até serem substituídos ou apagados nas configurações do dispositivo; backups do sistema seguem suas regras. Dados na nuvem e rankings são mantidos para o serviço de conta e podem ser objeto de pedidos de exclusão. Detalhes estatísticos seguem os prazos e ciclos de limpeza configurados, apenas conforme necessário para análise e melhoria; relatórios agregados podem durar mais. O Crashlytics normalmente inicia a remoção de erros e identificadores dos sistemas ativos e de backup após 90 dias. Outros identificadores seguem as regras do serviço correspondente.\n\nVocê pode retirar o consentimento de estatísticas e erros nas Configurações e gerenciar registros pelas ferramentas do Google. Desinstalar, apagar dados locais ou sair não elimina todos os dados na nuvem ou de terceiros. Retirar o consentimento não apaga automaticamente dados tratados legalmente antes.\n\nEscreva ao e-mail acima para pedir acesso, correção, exportação ou exclusão dos dados sob nosso controle. Pedimos apenas a verificação de identidade necessária e respondemos nos prazos legais. Tratamos conforme as regras os pedidos sobre dados processados por prestadores em nosso nome. Dados de conta geridos independentemente pelo Google são gerenciados no Google. A retenção legal obrigatória tem finalidade limitada e explicada.","policy.changes":"8. Menores e alterações\nO jogo é destinado a pessoas com 16 anos ou mais, não especificamente a crianças. Abaixo da idade local para consentir validamente de forma independente, é necessário obter o consentimento do responsável exigido por lei. Responsáveis podem relatar falta de autorização ao e-mail acima; verificaremos e adotaremos as medidas legais necessárias, como interromper o tratamento ou excluir dados.\n\nEm mudanças importantes, atualizamos a política e notificamos ou pedimos novo consentimento conforme a lei. Ela está disponível no jogo e no site público.","policy.draft":"Rascunho: operador, e-mail e URL pública serão incluídos antes da publicação.","policy.contact":"Desenvolvedor / marca: {brand}\nResponsável: {operator}\nContato de privacidade: {email}"}},"it":{"name":"Italiano","messages":{"policy.title":"Informativa sulla privacy","policy.choice":"Leggi l’informativa e scegli se accettarla.","policy.reject":"Rifiuta","policy.accept":"Accetta e gioca","policy.rejected":"Serve accettare per entrare. Puoi chiudere il gioco.","policy.saveFailed":"Salvataggio non riuscito. Riprova.","policy.updated":"Ultimo aggiornamento: {date}","policy.security":"6. Fornitori, sicurezza e trasferimenti\nUsiamo servizi come Google Play Games, AdMob e Firebase e adottiamo misure ragionevoli di sicurezza e controllo degli accessi. Possiamo comunicare informazioni necessarie per obblighi legali, controversie o tutela di diritti legittimi.\n\nI fornitori possono trattare dati fuori dalla tua regione, con decisioni di adeguatezza, clausole contrattuali standard o altre garanzie legali, se applicabili. Contattaci per dettagli. Il sito usa GitHub Pages; GitHub può trattare IP dei visitatori per sicurezza.","policy.regions":"7. Disposizioni regionali e diritti\nSEE e Regno Unito: il trattamento necessario di account e salvataggi esegue i servizi richiesti; statistiche ed errori facoltativi si basano sul consenso. Sicurezza e prevenzione degli abusi necessarie possono basarsi su interessi legittimi quando consentito, bilanciati con i tuoi diritti. Il consenso pubblicitario è separato. I diritti applicabili comprendono accesso, rettifica, cancellazione, limitazione, opposizione, portabilità, revoca e reclamo all'autorità locale. La revoca non influisce sul trattamento lecito precedente.\n\nRegioni USA applicabili: le leggi locali possono consentire conoscenza, accesso, rettifica, cancellazione e rifiuto di trattamenti qualificati come vendita, condivisione o pubblicità mirata, senza discriminazione illecita.\n\nAltrove valgono i diritti locali applicabili. Le regole dipendono dall'ambito della legge, non dalla lingua dell'interfaccia. Invia richieste all'indirizzo sopra.","policy.intro":"Rispettiamo la tua privacy. Questa informativa spiega quali informazioni utilizza Sudoku e per quali finalità.","policy.local":"1. Dati di gioco\nSalviamo progressi, risultati e impostazioni sul tuo dispositivo per conservare i tuoi dati di gioco e offrire un'esperienza normale.","policy.google":"2. Account e salvataggi cloud\nGoogle Play Games tratta ID giocatore, nome pubblico, avatar, posizione e risultati per identificare l'account, mostrare profili e fornire classifiche. Queste informazioni possono essere visibili secondo le impostazioni privacy di Google.\n\nUsando il cloud, progressi, risultati, completamenti, partite incompiute e identificatori necessari sono salvati tramite Google Play Games Saved Games per ripristino e sincronizzazione tra dispositivi. Impostazioni locali e scelte privacy non si sincronizzano. La disconnessione non cancella automaticamente i dati.","policy.ads":"3. Servizi pubblicitari\nUtilizziamo Google AdMob per offrire annunci con premio che scegli volontariamente di guardare. I servizi pubblicitari possono trattare il tuo indirizzo IP e la posizione approssimativa dedotta da esso, informazioni sul dispositivo e sull'app, identificatori del dispositivo o dell'account (inclusi quelli pubblicitari), registri delle interazioni e dati diagnostici per mostrare annunci, misurarne l'efficacia e prevenire frodi. Il consenso pubblicitario è gestito separatamente secondo i requisiti regionali.","policy.telemetry":"4. Statistiche, errori e configurazione\nSe attivati separatamente, Firebase Analytics e Crashlytics trattano utilizzo dell'app, informazioni su dispositivo e sistema, versioni, identificatori d'installazione ed errori per comprendere l'utilizzo e migliorare la stabilità. Ogni scelta è revocabile nelle Impostazioni; la raccolta facoltativa non è necessaria per giocare. La completa disattivazione dei rapporti nativi può richiedere un riavvio.\n\nSe attivato, Firebase Remote Config può trattare identificatori d'installazione per fornire configurazioni dell'app.","policy.rights":"5. Conservazione e gestione dei dati\nI dati locali restano fino alla sostituzione o cancellazione nelle impostazioni del dispositivo; i backup di sistema seguono le sue regole. Salvataggi cloud e classifiche sono conservati per i servizi dell'account e soggetti a richieste di cancellazione. I dettagli statistici seguono durata e cicli di pulizia configurati e restano solo quanto necessario per analisi e miglioramento; i rapporti aggregati possono durare di più. Crashlytics normalmente avvia la cancellazione di errori e identificatori dai sistemi attivi e di backup dopo 90 giorni. Altri identificatori seguono le regole del rispettivo servizio.\n\nPuoi revocare il consenso a statistiche ed errori nelle Impostazioni e gestire i dati con gli strumenti Google. Disinstallare, cancellare dati locali o uscire non elimina tutti i dati cloud o di terzi. La revoca non cancella automaticamente dati già trattati lecitamente.\n\nScrivi all'indirizzo sopra per accesso, rettifica, esportazione o cancellazione dei dati sotto il nostro controllo. Chiediamo solo verifiche d'identità necessarie e rispondiamo nei termini legali. Gestiamo secondo le regole le richieste sui dati trattati da fornitori per nostro conto. I dati account gestiti autonomamente da Google si gestiscono presso Google. La conservazione obbligatoria per legge ha finalità limitate e spiegate.","policy.changes":"8. Minori e modifiche\nIl gioco è rivolto a persone dai 16 anni, non specificamente ai bambini. Sotto l'età locale per un consenso autonomo valido serve il consenso del tutore richiesto dalla legge. I tutori possono segnalare autorizzazioni mancanti all'indirizzo sopra; verificheremo e adotteremo misure legali necessarie, come interrompere il trattamento o cancellare dati.\n\nPer modifiche importanti aggiorniamo la politica e informiamo o chiediamo nuovo consenso secondo la legge. È disponibile nel gioco e sul sito pubblico.","policy.draft":"Bozza: operatore, email e URL pubblico saranno aggiunti prima della pubblicazione.","policy.contact":"Sviluppatore / marchio: {brand}\nGestore: {operator}\nContatto privacy: {email}"}},"ru":{"name":"Русский","messages":{"policy.title":"Политика конфиденциальности","policy.choice":"Прочитайте политику и решите, согласны ли вы с ней.","policy.reject":"Отклонить","policy.accept":"Принять и играть","policy.rejected":"Для входа нужно согласие. Можно закрыть игру.","policy.saveFailed":"Не удалось сохранить. Повторите попытку.","policy.updated":"Дата обновления: {date}","policy.security":"6. Поставщики, безопасность и трансграничная обработка\nМы используем Google Play Games, AdMob, Firebase и другие сервисы и принимаем разумные меры контроля доступа и безопасности. Необходимые сведения могут передаваться для исполнения закона, разрешения споров или защиты законных прав.\n\nПоставщики могут обрабатывать данные за пределами вашего региона, применяя решения об адекватности, стандартные договорные положения или иные законные гарантии, если применимо. За подробностями обращайтесь к нам. Сайт использует GitHub Pages; GitHub может обрабатывать IP посетителей для безопасности.","policy.regions":"7. Региональные положения и права\nЕЭЗ и Великобритания: необходимая обработка аккаунта и облачных сохранений обеспечивает запрошенные услуги; необязательная статистика и ошибки основаны на согласии. Необходимые безопасность и предотвращение злоупотреблений могут опираться на законные интересы, если разрешено, с учётом ваших прав. Рекламное согласие отдельно. Применимые права включают доступ, исправление, удаление, ограничение, возражение, переносимость, отзыв согласия и жалобу местному регулятору. Отзыв не влияет на прежнюю законную обработку.\n\nПрименимые регионы США: местное право может предоставлять доступ, сведения, исправление, удаление и отказ от обработки, юридически считающейся продажей, передачей или адресной рекламой, без незаконной дискриминации.\n\nВ остальных регионах действуют применимые местные права. Правила определяет применимость закона, а не язык интерфейса. Запросы направляйте на адрес выше.","policy.intro":"Мы уважаем вашу конфиденциальность. Эта политика объясняет, какую информацию использует Sudoku и для каких целей.","policy.local":"1. Игровые данные\nМы сохраняем прогресс, результаты и настройки на вашем устройстве, чтобы сохранять игровые записи и обеспечивать нормальную работу игры.","policy.google":"2. Аккаунты и облачные сохранения\nGoogle Play Games обрабатывает ID игрока, имя, аватар, место и результаты для идентификации аккаунта, профилей и таблиц лидеров. Данные могут быть видны другим игрокам согласно настройкам конфиденциальности Google.\n\nПри облачном сохранении прогресс, результаты, записи о прохождении, незавершённые игры и необходимые идентификаторы синхронизации хранятся через Google Play Games Saved Games для восстановления и синхронизации между устройствами. Локальные настройки и решения о конфиденциальности не синхронизируются. Выход из аккаунта не удаляет записи автоматически.","policy.ads":"3. Рекламные сервисы\nМы используем Google AdMob для показа рекламы с вознаграждением, которую вы смотрите добровольно. Рекламные сервисы могут обрабатывать IP-адрес и определённое по нему примерное местоположение, сведения об устройстве и приложении, идентификаторы устройства или аккаунта (включая рекламные), записи взаимодействий и диагностические данные для показа рекламы, измерения её эффективности и предотвращения мошенничества. Согласие на рекламу обрабатывается отдельно с учётом региональных требований.","policy.telemetry":"4. Статистика, ошибки и конфигурация\nПри отдельном включении Firebase Analytics и Crashlytics обрабатывают использование приложения, сведения об устройстве и системе, версии, идентификаторы установки и ошибки для анализа использования и повышения стабильности. Каждый выбор можно отозвать в настройках; необязательный сбор не нужен для игры. Для полного отключения нативных отчётов может потребоваться перезапуск.\n\nВключённый Firebase Remote Config может обрабатывать идентификаторы установки для предоставления конфигурации приложения.","policy.rights":"5. Хранение и управление данными\nЛокальные данные хранятся до замены или очистки в настройках устройства; системные копии подчиняются правилам системы. Облачные сохранения и рейтинги хранятся для обслуживания аккаунта, их удаление можно запросить. Подробная статистика подчиняется настроенным срокам и циклам очистки и хранится лишь по необходимости для анализа и улучшения; сводные отчёты могут храниться дольше. Crashlytics обычно начинает удаление ошибок и идентификаторов из рабочих и резервных систем после 90 дней. Другие идентификаторы подчиняются правилам соответствующих сервисов.\n\nСогласия на статистику и отчёты можно отозвать в настройках, а записи управлять средствами Google. Удаление приложения, очистка локальных данных или выход не удаляют все облачные и сторонние записи. Отзыв согласия также не удаляет автоматически уже законно обработанные данные.\n\nДля доступа, исправления, экспорта или удаления подконтрольных нам данных пишите на указанный выше адрес. Мы запрашиваем лишь необходимую проверку личности и отвечаем в установленные законом сроки. Запросы о данных, обрабатываемых поставщиками от нашего имени, рассматриваем по применимым правилам. Данные аккаунта, которыми Google управляет самостоятельно, управляются средствами Google. Обязательное по закону хранение ограничивается по цели и объясняется.","policy.changes":"8. Несовершеннолетние и изменения\nИгра предназначена для пользователей от 16 лет, а не специально для детей. Если местный возраст для самостоятельного действительного согласия не достигнут, требуется предусмотренное законом согласие опекуна. Опекуны могут сообщить об отсутствии разрешения по адресу выше; мы проверим и примем законные меры, включая прекращение обработки или удаление.\n\nПри существенных изменениях обновляем политику и уведомляем либо запрашиваем новое согласие согласно закону. Политика доступна в игре и на открытом сайте.","policy.draft":"Черновик: оператор, почта и публичный URL будут добавлены до выпуска.","policy.contact":"Разработчик / бренд: {brand}\nОператор: {operator}\nКонтакт по вопросам данных: {email}"}},"uk":{"name":"Українська","messages":{"policy.title":"Політика конфіденційності","policy.choice":"Прочитайте політику та вирішіть, чи погоджуєтеся з нею.","policy.reject":"Відхилити","policy.accept":"Прийняти й грати","policy.rejected":"Для входу потрібна згода. Можна закрити гру.","policy.saveFailed":"Не вдалося зберегти. Спробуйте ще раз.","policy.updated":"Дата оновлення: {date}","policy.security":"6. Постачальники, безпека й міжнародна обробка\nМи використовуємо Google Play Games, AdMob, Firebase та інші сервіси й застосовуємо розумні заходи безпеки та контролю доступу. Потрібні відомості можуть надаватися для виконання закону, вирішення спорів або захисту законних прав.\n\nПостачальники можуть обробляти дані за межами вашого регіону, застосовуючи рішення про достатність захисту, стандартні договірні положення чи інші законні гарантії, коли це застосовно. Звертайтеся за деталями. Сайт використовує GitHub Pages; GitHub може обробляти IP відвідувачів для безпеки.","policy.regions":"7. Регіональні положення та права\nЄЕЗ і Велика Британія: необхідна обробка облікових записів і хмарних даних забезпечує запитані послуги; необов'язкові статистика та помилки ґрунтуються на згоді. Необхідні безпека й запобігання зловживанням можуть ґрунтуватися на законних інтересах, якщо дозволено, з урахуванням ваших прав. Рекламна згода окрема. Застосовні права включають доступ, виправлення, видалення, обмеження, заперечення, перенесення, відкликання та скаргу місцевому регулятору. Відкликання не впливає на попередню законну обробку.\n\nЗастосовні регіони США: місцеві закони можуть надавати права знати, отримувати доступ, виправляти, видаляти й відмовлятися від обробки, юридично визначеної як продаж, поширення або цільова реклама, без незаконної дискримінації.\n\nВ інших регіонах діють застосовні місцеві права. Правила визначає сфера закону, а не мова інтерфейсу. Запити надсилайте на адресу вище.","policy.intro":"Ми поважаємо вашу конфіденційність. Ця політика пояснює, яку інформацію використовує Sudoku та з якою метою.","policy.local":"1. Ігрові дані\nМи зберігаємо прогрес, результати й налаштування на вашому пристрої, щоб зберігати ігрові записи та забезпечувати нормальну роботу гри.","policy.google":"2. Облікові записи та хмарні збереження\nGoogle Play Games обробляє ID гравця, ім'я, аватар, місце та результати для визначення облікового запису, профілів і таблиць лідерів. Дані можуть бути видимі іншим гравцям відповідно до налаштувань Google.\n\nДля хмарного збереження поступ, результати, завершення, незакінчені ігри та потрібні ідентифікатори синхронізації зберігаються через Google Play Games Saved Games для відновлення і синхронізації між пристроями. Локальні налаштування та рішення щодо приватності не синхронізуються. Вихід не видаляє записи автоматично.","policy.ads":"3. Рекламні сервіси\nМи використовуємо Google AdMob для реклами з винагородою, яку ви переглядаєте добровільно. Рекламні сервіси можуть обробляти IP-адресу та визначене за нею приблизне місцезнаходження, відомості про пристрій і застосунок, ідентифікатори пристрою або облікового запису (зокрема рекламні), записи взаємодій і діагностичні дані для показу реклами, вимірювання її ефективності та запобігання шахрайству. Згода на рекламу обробляється окремо відповідно до регіональних вимог.","policy.telemetry":"4. Статистика, помилки й конфігурація\nЗа окремого ввімкнення Firebase Analytics і Crashlytics обробляють використання застосунку, дані пристрою та системи, версії, ідентифікатори встановлення і помилки для аналізу та поліпшення стабільності. Кожну згоду можна відкликати в налаштуваннях; необов'язковий збір не потрібен для гри. Повне вимкнення нативних звітів може вимагати перезапуску.\n\nУвімкнений Firebase Remote Config може обробляти ідентифікатори встановлення для надання конфігурації застосунку.","policy.rights":"5. Зберігання та керування даними\nЛокальні дані зберігаються до заміни або очищення через налаштування пристрою; системні копії підлягають правилам системи. Хмарні збереження й рейтинги зберігаються для обслуговування облікового запису, їх видалення можна запитати. Детальна статистика підлягає налаштованим строкам і циклам очищення й зберігається лише за потреби аналізу та поліпшення; зведені звіти можуть залишатися довше. Crashlytics зазвичай починає видалення помилок та ідентифікаторів із робочих і резервних систем після 90 днів. Інші ідентифікатори підлягають правилам відповідних сервісів.\n\nЗгоду на статистику та помилки можна відкликати в налаштуваннях, а записи керувати засобами Google. Видалення застосунку, очищення локальних даних або вихід не видаляє всіх хмарних і сторонніх записів. Відкликання також не видаляє автоматично вже законно оброблені дані.\n\nДля доступу, виправлення, експорту або видалення підконтрольних нам даних пишіть на адресу вище. Ми просимо лише потрібну перевірку особи й відповідаємо у законні строки. Запити про дані, оброблені постачальниками від нашого імені, опрацьовуємо за відповідними правилами. Дані облікового запису, якими Google керує незалежно, керуються через Google. Обов'язкове законне зберігання обмежується за метою та пояснюється.","policy.changes":"8. Неповнолітні та зміни\nГра призначена для користувачів від 16 років, не спеціально для дітей. До досягнення місцевого віку для самостійної чинної згоди потрібна передбачена законом згода опікуна. Опікуни можуть повідомити про відсутнє дозволення на адресу вище; ми перевіримо й уживемо законних заходів, зокрема припинення обробки або видалення.\n\nЗа істотних змін оновлюємо політику та повідомляємо або просимо нову згоду згідно із законом. Вона доступна в грі та на відкритому сайті.","policy.draft":"Чернетка: оператора, пошту й публічний URL додамо до випуску.","policy.contact":"Розробник / бренд: {brand}\nОператор: {operator}\nКонтакт щодо даних: {email}"}},"pl":{"name":"Polski","messages":{"policy.title":"Polityka prywatności","policy.choice":"Przeczytaj zasady i zdecyduj, czy je akceptujesz.","policy.reject":"Odrzuć","policy.accept":"Zgoda i start","policy.rejected":"Wejście wymaga zgody. Możesz zamknąć grę.","policy.saveFailed":"Nie udało się zapisać. Spróbuj ponownie.","policy.updated":"Data aktualizacji: {date}","policy.security":"6. Dostawcy, bezpieczeństwo i transfery\nKorzystamy m.in. z Google Play Games, AdMob i Firebase oraz stosujemy rozsądne środki bezpieczeństwa i kontroli dostępu. Niezbędne dane mogą być udostępnione w celu realizacji obowiązków prawnych, rozwiązania sporów lub ochrony uzasadnionych praw.\n\nDostawcy mogą przetwarzać dane poza Twoim regionem, stosując odpowiednie decyzje o adekwatności, standardowe klauzule umowne lub inne uznane zabezpieczenia. Szczegóły uzyskasz, kontaktując się z nami. Strona korzysta z GitHub Pages; GitHub może przetwarzać IP odwiedzających dla bezpieczeństwa.","policy.regions":"7. Postanowienia regionalne i prawa\nEOG i Wielka Brytania: konieczne przetwarzanie kont i zapisów służy wykonaniu żądanych usług; opcjonalne statystyki i błędy opierają się na zgodzie. Konieczna ochrona i zapobieganie nadużyciom mogą opierać się na prawnie uzasadnionym interesie, jeśli prawo pozwala, po uwzględnieniu Twoich praw. Zgoda reklamowa jest odrębna. Stosowne prawa obejmują dostęp, sprostowanie, usunięcie, ograniczenie, sprzeciw, przenoszenie, wycofanie zgody i skargę do lokalnego regulatora. Wycofanie nie wpływa na wcześniejsze zgodne z prawem przetwarzanie.\n\nWłaściwe regiony USA: prawo lokalne może umożliwiać poznanie, dostęp, poprawianie, usuwanie i rezygnację z przetwarzania uznanego za sprzedaż, udostępnianie lub reklamę ukierunkowaną, bez bezprawnej dyskryminacji.\n\nW innych regionach obowiązują właściwe lokalne prawa. Decyduje zakres prawa, nie język interfejsu. Wnioski wysyłaj na adres powyżej.","policy.intro":"Szanujemy Twoją prywatność. Ta polityka wyjaśnia, jakich informacji używa Sudoku i w jakim celu.","policy.local":"1. Dane gry\nZapisujemy postęp, wyniki i ustawienia na Twoim urządzeniu, aby zachować dane rozgrywki i zapewnić normalne działanie gry.","policy.google":"2. Konta i zapis w chmurze\nGoogle Play Games przetwarza identyfikator gracza, nazwę, awatar, pozycję i wyniki w celu identyfikacji konta, wyświetlania profilu i rankingów. Dane mogą być widoczne dla innych graczy zgodnie z ustawieniami Google.\n\nPrzy zapisie w chmurze postępy, wyniki, ukończenia, niedokończone gry i potrzebne identyfikatory synchronizacji są przechowywane przez Google Play Games Saved Games do odtwarzania i synchronizacji urządzeń. Ustawienia lokalne i decyzje o prywatności nie są synchronizowane. Wylogowanie nie usuwa tych danych automatycznie.","policy.ads":"3. Usługi reklamowe\nUżywamy Google AdMob do udostępniania reklam z nagrodą, które oglądasz dobrowolnie. Usługi reklamowe mogą przetwarzać adres IP i wynikającą z niego przybliżoną lokalizację, informacje o urządzeniu i aplikacji, identyfikatory urządzenia lub konta (w tym reklamowe), zapisy interakcji i dane diagnostyczne, aby wyświetlać reklamy, mierzyć ich skuteczność i zapobiegać oszustwom. Zgoda na reklamy jest obsługiwana osobno zgodnie z wymogami regionalnymi.","policy.telemetry":"4. Statystyki, błędy i konfiguracja\nPo osobnym włączeniu Firebase Analytics i Crashlytics przetwarzają użycie aplikacji, informacje o urządzeniu i systemie, wersje, identyfikatory instalacji i błędy, aby analizować użycie i poprawiać stabilność. Każdą zgodę można wycofać w Ustawieniach; opcjonalne zbieranie nie jest wymagane do gry. Pełne wyłączenie natywnych raportów może wymagać ponownego uruchomienia.\n\nWłączony Firebase Remote Config może przetwarzać identyfikatory instalacji w celu dostarczania konfiguracji aplikacji.","policy.rights":"5. Przechowywanie i zarządzanie danymi\nDane lokalne pozostają do nadpisania lub usunięcia w ustawieniach urządzenia; kopie systemowe podlegają zasadom systemu. Zapisy w chmurze i rankingi są przechowywane dla usług konta i mogą podlegać wnioskom o usunięcie. Szczegóły statystyczne podlegają skonfigurowanym okresom i cyklom czyszczenia i pozostają tylko tak długo, jak potrzeba do analizy i ulepszeń; raporty zbiorcze mogą pozostać dłużej. Crashlytics zwykle rozpoczyna usuwanie błędów i identyfikatorów z systemów bieżących i zapasowych po 90 dniach. Inne identyfikatory podlegają zasadom odpowiedniej usługi.\n\nZgody na statystyki i błędy można wycofać w Ustawieniach, a dane zarządzać narzędziami Google. Odinstalowanie, usunięcie lokalnych danych lub wylogowanie nie usuwa wszystkich danych chmurowych i zewnętrznych. Wycofanie zgody nie usuwa automatycznie danych już przetworzonych zgodnie z prawem.\n\nAby uzyskać dostęp, sprostowanie, eksport lub usunięcie danych pod naszą kontrolą, napisz na adres powyżej. Prosimy tylko o konieczną weryfikację tożsamości i odpowiadamy w terminach prawnych. Obsługujemy zgodnie z zasadami wnioski dotyczące danych przetwarzanych na nasze zlecenie. Dane konta niezależnie zarządzane przez Google należy zarządzać w Google. Przechowywanie wymagane prawem jest ograniczone celowo i wyjaśnione.","policy.changes":"8. Niepełnoletni i zmiany\nGra jest przeznaczona dla osób od 16 lat, nie specjalnie dla dzieci. Poniżej lokalnego wieku ważnej samodzielnej zgody wymagana jest prawna zgoda opiekuna. Opiekunowie mogą zgłaszać brak zgody na adres powyżej; sprawdzimy sprawę i podejmiemy wymagane prawem środki, takie jak zaprzestanie przetwarzania lub usunięcie danych.\n\nPrzy istotnych zmianach aktualizujemy politykę i informujemy lub prosimy o nową zgodę zgodnie z prawem. Jest dostępna w grze i na publicznej stronie.","policy.draft":"Projekt: operator, e-mail i publiczny URL zostaną dodane przed publikacją.","policy.contact":"Deweloper / marka: {brand}\nOperator: {operator}\nKontakt w sprawie prywatności: {email}"}},"tr":{"name":"Türkçe","messages":{"policy.title":"Gizlilik politikası","policy.choice":"Politikayı okuyun ve kabul edip etmediğinizi seçin.","policy.reject":"Reddet","policy.accept":"Kabul et ve oyna","policy.rejected":"Giriş için kabul gerekir. Oyunu kapatabilirsiniz.","policy.saveFailed":"Seçim kaydedilemedi. Tekrar deneyin.","policy.updated":"Güncelleme tarihi: {date}","policy.security":"6. Sağlayıcılar, güvenlik ve uluslararası işleme\nGoogle Play Games, AdMob ve Firebase gibi hizmetleri kullanır, makul erişim ve güvenlik önlemleri alırız. Yasal yükümlülükler, uyuşmazlık çözümü veya meşru hakların korunması için gerekli bilgiler paylaşılabilir.\n\nSağlayıcılar verileri bölgeniz dışında, gerektiğinde yeterlilik kararları, standart sözleşme maddeleri veya tanınan başka güvencelerle işleyebilir. Ayrıntılar için bize yazın. Politika sitesi GitHub Pages kullanır; GitHub güvenlik için ziyaretçi IP adreslerini işleyebilir.","policy.regions":"7. Bölgesel hükümler ve haklar\nAEA ve Birleşik Krallık: gerekli hesap ve bulut işlemesi talep ettiğiniz hizmeti yerine getirir; isteğe bağlı istatistik ve hata raporları onaya dayanır. Gerekli güvenlik ve kötüye kullanım önleme, hukuken izin verildiğinde haklarınızla dengelenen meşru menfaatlere dayanabilir. Reklam onayı ayrıdır. Geçerli haklar erişim, düzeltme, silme, kısıtlama, itiraz, taşıma, onayı geri alma ve yerel kuruma şikâyeti içerir. Geri alma önceki yasal işlemleri etkilemez.\n\nİlgili ABD bölgeleri: yerel yasalar bilgi edinme, erişim, düzeltme, silme ve hukuken satış, paylaşım veya hedefli reklam sayılan işlemeyi reddetme hakkı verebilir; hukuka aykırı ayrımcılık yapılamaz.\n\nDiğer bölgelerde ilgili yerel haklar geçerlidir. Kuralları arayüz dili değil hukuki kapsam belirler. Talepleri yukarıdaki adrese gönderin.","policy.intro":"Gizliliğinize önem veriyoruz. Bu politika, Sudoku'nun hangi bilgileri hangi amaçlarla kullandığını açıklar.","policy.local":"1. Oyun verileri\nOyun kayıtlarınızı korumak ve normal bir oyun deneyimi sunmak için ilerlemeyi, sonuçları ve ayarları cihazınıza kaydederiz.","policy.google":"2. Hesaplar ve bulut kayıtları\nGoogle Play Games hesap tanıma, profil ve sıralamalar için oyuncu kimliği, görünen ad, avatar, sıra ve sonuçları işler. Bu bilgiler Google gizlilik ayarlarına göre diğer oyunculara görünebilir.\n\nBulut kaydı kullanıldığında ilerleme, sonuçlar, tamamlanma kayıtları, bitmemiş oyunlar ve gerekli eşitleme kimlikleri geri yükleme ve cihazlar arası eşitleme için Google Play Games Saved Games üzerinden saklanır. Yerel ayarlar ve gizlilik seçimleri eşitlenmez. Çıkış yapmak kayıtları otomatik silmez.","policy.ads":"3. Reklam hizmetleri\nİsteğe bağlı izlediğiniz ödüllü reklamları sunmak için Google AdMob'u kullanırız. Reklam hizmetleri; reklam göstermek, performansı ölçmek ve dolandırıcılığı önlemek amacıyla IP adresinizi ve bundan çıkarılan yaklaşık konumu, cihaz ve uygulama bilgilerini, cihaz veya hesap tanımlayıcılarını (reklam tanımlayıcıları dahil), etkileşim kayıtlarını ve tanılama bilgilerini işleyebilir. Reklam onayı bölgesel gerekliliklere göre ayrı olarak ele alınır.","policy.telemetry":"4. İstatistikler, hatalar ve yapılandırma\nAyrı ayrı etkinleştirirseniz Firebase Analytics ve Crashlytics kullanımın anlaşılması ve kararlılığın iyileştirilmesi için uygulama kullanımı, cihaz ve sistem bilgileri, sürümler, kurulum kimlikleri ve hataları işler. Her seçimi Ayarlar'da geri alabilirsiniz; isteğe bağlı toplama oynamak için gerekli değildir. Yerel hata raporlarının tamamen kapanması yeniden başlatma gerektirebilir.\n\nEtkin Firebase Remote Config uygulama yapılandırmasını sağlamak için kurulum kimliklerini işleyebilir.","policy.rights":"5. Saklama ve veri yönetimi\nYerel veriler üzerine yazılana veya cihaz ayarlarından silinene kadar kalır; sistem yedekleri sistem kurallarını izler. Bulut kayıtları ve sıralamalar hesap hizmetleri için saklanır ve silme taleplerine konu olabilir. Ayrıntılı istatistikler yapılandırılan süre ve temizlik döngülerine göre, yalnızca analiz ve iyileştirme gerektiği ölçüde saklanır; toplu raporlar daha uzun kalabilir. Crashlytics ilgili hata ve kimlikleri canlı ve yedek sistemlerden genellikle 90 gün sonra silmeye başlar. Diğer kimlikler ilgili hizmet kurallarını izler.\n\nİstatistik ve hata onaylarını Ayarlar'da geri alabilir, Google hesap veya oyun verisi araçlarıyla kayıtları yönetebilirsiniz. Uygulamayı kaldırmak, yerel verileri silmek veya çıkmak tüm bulut ve üçüncü taraf verilerini silmez. Onayı geri almak önceden hukuka uygun işlenen verileri otomatik silmez.\n\nKontrolümüzdeki verilere erişim, düzeltme, dışa aktarma veya silme için yukarıdaki e-postaya yazın. Yalnızca gerekli kimlik doğrulamasını ister ve yasal sürelerde yanıtlarız. Adımıza işlenen verilere ilişkin talepleri ilgili kurallara göre biz ele alırız. Google'ın bağımsız yönettiği hesap bilgileri Google üzerinden yönetilir. Yasayla gerekli saklamanın amacı sınırlanır ve açıklanır.","policy.changes":"8. Küçükler ve değişiklikler\nOyun 16 yaş ve üzeri kullanıcılar içindir, özel olarak çocuklara yönelik değildir. Yerel olarak bağımsız geçerli onay yaşının altındaki kullanıcılar yasayla gereken veli onayını almalıdır. Veliler eksik yetkilendirmeyi yukarıdaki adrese bildirebilir; inceleyip işlemeyi durdurma veya silme gibi yasal tedbirleri alırız.\n\nÖnemli değişikliklerde politikayı günceller, yasaya göre bildirir veya yeniden onay isteriz. Politikaya oyundan ve açık web sitesinden ulaşabilirsiniz.","policy.draft":"İnceleme taslağı: işletmeci, e-posta ve açık URL yayından önce eklenecek.","policy.contact":"Geliştirici / marka: {brand}\nİşletmeci: {operator}\nGizlilik iletişimi: {email}"}},"id":{"name":"Indonesia","messages":{"policy.title":"Kebijakan privasi","policy.choice":"Baca kebijakan dan pilih apakah Anda menyetujuinya.","policy.reject":"Tolak","policy.accept":"Setuju & masuk","policy.rejected":"Perlu persetujuan untuk masuk. Anda dapat menutup game.","policy.saveFailed":"Gagal menyimpan pilihan. Coba lagi.","policy.updated":"Terakhir diperbarui: {date}","policy.security":"6. Penyedia, keamanan dan pemrosesan lintas negara\nKami memakai layanan termasuk Google Play Games, AdMob dan Firebase serta langkah keamanan dan kontrol akses yang wajar. Informasi perlu dapat diberikan untuk kewajiban hukum, sengketa atau perlindungan hak sah.\n\nPenyedia dapat memproses data di luar wilayah Anda, memakai keputusan kecukupan, klausul kontrak standar atau perlindungan hukum lain bila berlaku. Hubungi kami untuk detail. Situs memakai GitHub Pages; GitHub dapat memproses IP pengunjung untuk keamanan.","policy.regions":"7. Ketentuan wilayah dan hak\nEEA dan Inggris: pemrosesan akun dan cloud yang perlu menjalankan layanan yang diminta; statistik dan kesalahan opsional berdasarkan persetujuan. Keamanan dan pencegahan penyalahgunaan yang perlu dapat berdasar kepentingan sah bila diizinkan, dengan menimbang hak Anda. Persetujuan iklan terpisah. Hak berlaku meliputi akses, koreksi, hapus, pembatasan, keberatan, portabilitas, penarikan persetujuan dan keluhan ke pengawas setempat. Penarikan tidak memengaruhi pemrosesan sah sebelumnya.\n\nWilayah AS yang berlaku: hukum setempat dapat memberi hak mengetahui, mengakses, memperbaiki, menghapus serta menolak pemrosesan yang dikategorikan sebagai penjualan, berbagi atau iklan tertarget, tanpa diskriminasi ilegal.\n\nWilayah lain mengikuti hak data lokal yang berlaku. Cakupan hukum, bukan bahasa antarmuka, menentukan aturan. Kirim permintaan ke email di atas.","policy.intro":"Kami menghargai privasi Anda. Kebijakan ini menjelaskan informasi yang digunakan Sudoku dan tujuannya.","policy.local":"1. Data permainan\nKami menyimpan progres, hasil, dan pengaturan pada perangkat Anda untuk mempertahankan catatan permainan dan memberikan pengalaman bermain yang normal.","policy.google":"2. Akun dan penyimpanan cloud\nGoogle Play Games memproses ID pemain, nama tampilan, avatar, peringkat dan hasil untuk identifikasi akun, profil serta papan peringkat. Informasi dapat terlihat oleh pemain lain sesuai pengaturan privasi Google.\n\nSaat memakai cloud, progres, hasil, catatan penyelesaian, permainan belum selesai dan pengenal sinkronisasi yang diperlukan disimpan melalui Google Play Games Saved Games untuk pemulihan dan sinkronisasi antarperangkat. Pengaturan lokal dan pilihan privasi tidak disinkronkan. Keluar akun tidak otomatis menghapus catatan.","policy.ads":"3. Layanan iklan\nKami menggunakan Google AdMob untuk menyediakan iklan berhadiah yang Anda pilih untuk ditonton. Layanan iklan dapat memproses alamat IP dan perkiraan lokasi yang diturunkan darinya, informasi perangkat dan aplikasi, pengenal perangkat atau akun (termasuk pengenal iklan), catatan interaksi, dan diagnostik untuk menampilkan iklan, mengukur kinerja, dan mencegah penipuan. Persetujuan iklan ditangani secara terpisah sesuai persyaratan wilayah.","policy.telemetry":"4. Statistik, laporan kesalahan dan konfigurasi\nJika diaktifkan secara terpisah, Firebase Analytics dan Crashlytics memproses penggunaan aplikasi, informasi perangkat dan sistem, versi, pengenal instalasi serta kesalahan untuk memahami penggunaan dan meningkatkan stabilitas. Setiap pilihan dapat ditarik di Pengaturan; pengumpulan opsional tidak diperlukan untuk bermain. Menonaktifkan sepenuhnya laporan native mungkin memerlukan mulai ulang aplikasi.\n\nFirebase Remote Config yang aktif dapat memproses pengenal instalasi untuk menyediakan konfigurasi aplikasi.","policy.rights":"5. Penyimpanan dan pengelolaan data\nData lokal disimpan sampai ditimpa atau dibersihkan melalui pengaturan perangkat; cadangan sistem mengikuti aturan sistem. Cloud dan peringkat disimpan untuk layanan akun dan dapat dimintakan penghapusan. Statistik terperinci mengikuti masa simpan dan siklus pembersihan yang dikonfigurasi, hanya selama dibutuhkan untuk analisis dan perbaikan; laporan agregat dapat bertahan lebih lama. Crashlytics biasanya mulai menghapus kesalahan dan pengenal terkait dari sistem aktif dan cadangan setelah 90 hari. Pengenal lain mengikuti aturan layanan masing-masing.\n\nPersetujuan statistik dan laporan dapat ditarik di Pengaturan, dan catatan dikelola melalui alat akun atau data game Google. Menghapus aplikasi, data lokal atau keluar tidak menghapus semua data cloud dan pihak ketiga. Menarik persetujuan juga tidak otomatis menghapus data yang sudah diproses secara sah.\n\nKirim email ke alamat di atas untuk akses, koreksi, ekspor atau penghapusan data yang kami kendalikan. Kami hanya meminta verifikasi identitas yang diperlukan dan menjawab dalam batas waktu hukum. Kami menangani permintaan atas data yang diproses penyedia untuk kami sesuai aturan. Data akun yang dikelola mandiri oleh Google dikelola lewat Google. Penyimpanan wajib hukum dibatasi tujuannya dan dijelaskan.","policy.changes":"8. Anak di bawah umur dan perubahan\nGame ditujukan bagi usia 16 tahun ke atas, bukan khusus anak-anak. Di bawah usia setempat untuk persetujuan mandiri yang sah, persetujuan wali yang diwajibkan hukum harus diperoleh. Wali dapat melaporkan ketiadaan izin ke email di atas; kami menyelidiki dan mengambil langkah hukum yang perlu, seperti menghentikan pemrosesan atau menghapus data.\n\nUntuk perubahan penting, kami memperbarui kebijakan dan memberi tahu atau meminta persetujuan baru sesuai hukum. Kebijakan tersedia dalam game dan situs publik.","policy.draft":"Draf tinjauan: operator, email dan URL publik akan ditambahkan sebelum rilis.","policy.contact":"Pengembang / merek: {brand}\nOperator: {operator}\nKontak privasi: {email}"}},"vi":{"name":"Tiếng Việt","messages":{"policy.title":"Chính sách riêng tư","policy.choice":"Hãy đọc chính sách và chọn có đồng ý hay không.","policy.reject":"Từ chối","policy.accept":"Đồng ý và chơi","policy.rejected":"Cần đồng ý để vào. Bạn có thể đóng trò chơi.","policy.saveFailed":"Không lưu được lựa chọn. Hãy thử lại.","policy.updated":"Ngày cập nhật: {date}","policy.security":"6. Nhà cung cấp, bảo mật và xử lý quốc tế\nChúng tôi dùng Google Play Games, AdMob, Firebase và các dịch vụ khác, áp dụng kiểm soát truy cập và biện pháp bảo mật hợp lý. Thông tin cần thiết có thể cung cấp để thực hiện nghĩa vụ pháp lý, giải quyết tranh chấp hoặc bảo vệ quyền hợp pháp.\n\nNhà cung cấp có thể xử lý ngoài khu vực của bạn, dùng quyết định công nhận mức bảo vệ, điều khoản hợp đồng tiêu chuẩn hoặc bảo đảm hợp pháp khác khi áp dụng. Hãy liên hệ để biết chi tiết. Trang chính sách dùng GitHub Pages; GitHub có thể xử lý IP khách truy cập vì an toàn.","policy.regions":"7. Quy định khu vực và quyền của bạn\nEEA và Vương quốc Anh: xử lý tài khoản và đám mây cần thiết dựa trên việc cung cấp dịch vụ bạn yêu cầu; thống kê và lỗi tùy chọn dựa trên đồng ý. Bảo mật và chống lạm dụng cần thiết có thể dựa v
