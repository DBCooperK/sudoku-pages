ào lợi ích hợp pháp khi luật cho phép, cân nhắc quyền của bạn. Đồng ý quảng cáo được xử lý riêng. Quyền áp dụng gồm truy cập, sửa, xóa, hạn chế, phản đối, chuyển dữ liệu, rút đồng ý và khiếu nại cơ quan địa phương. Rút lại không ảnh hưởng xử lý hợp pháp trước đó.\n\nKhu vực Hoa Kỳ áp dụng: luật địa phương có thể cho phép biết, truy cập, sửa, xóa và từ chối xử lý được xem là bán, chia sẻ hoặc quảng cáo nhắm mục tiêu, không bị phân biệt đối xử trái luật.\n\nNơi khác áp dụng quyền dữ liệu theo luật địa phương. Phạm vi pháp luật, không phải ngôn ngữ giao diện, quyết định quy tắc. Gửi yêu cầu đến email trên.","policy.intro":"Chúng tôi tôn trọng quyền riêng tư của bạn. Chính sách này giải thích Sudoku sử dụng những thông tin nào và cho mục đích gì.","policy.local":"1. Dữ liệu trò chơi\nChúng tôi lưu tiến độ, kết quả và cài đặt trên thiết bị của bạn để giữ lại dữ liệu chơi và cung cấp trải nghiệm trò chơi bình thường.","policy.google":"2. Tài khoản và lưu trên đám mây\nGoogle Play Games xử lý ID người chơi, tên hiển thị, ảnh đại diện, thứ hạng và kết quả để nhận diện tài khoản, hiển thị hồ sơ và bảng xếp hạng. Thông tin có thể hiển thị theo cài đặt riêng tư của Google.\n\nKhi dùng lưu đám mây, tiến độ, kết quả, hồ sơ hoàn thành, ván chưa xong và mã đồng bộ cần thiết được lưu qua Google Play Games Saved Games để khôi phục và đồng bộ giữa thiết bị. Cài đặt cục bộ và lựa chọn riêng tư không được đồng bộ. Đăng xuất không tự động xóa các hồ sơ này.","policy.ads":"3. Dịch vụ quảng cáo\nChúng tôi sử dụng Google AdMob để cung cấp quảng cáo có thưởng mà bạn tự nguyện xem. Dịch vụ quảng cáo có thể xử lý địa chỉ IP và vị trí gần đúng suy ra từ đó, thông tin thiết bị và ứng dụng, mã định danh thiết bị hoặc tài khoản (bao gồm mã quảng cáo), bản ghi tương tác và dữ liệu chẩn đoán để hiển thị quảng cáo, đo lường hiệu quả và phòng chống gian lận. Việc đồng ý quảng cáo được xử lý riêng theo yêu cầu của từng khu vực.","policy.telemetry":"4. Thống kê, lỗi và cấu hình\nNếu bật riêng từng dịch vụ, Firebase Analytics và Crashlytics xử lý việc dùng ứng dụng, thông tin thiết bị và hệ thống, phiên bản, mã cài đặt và lỗi để hiểu cách sử dụng và cải thiện độ ổn định. Có thể rút lại từng lựa chọn trong Cài đặt; thu thập tùy chọn không bắt buộc để chơi. Tắt hoàn toàn báo cáo lỗi gốc có thể cần khởi động lại ứng dụng.\n\nKhi bật, Firebase Remote Config có thể xử lý mã cài đặt để cung cấp cấu hình ứng dụng.","policy.rights":"5. Lưu giữ và quản lý dữ liệu\nDữ liệu cục bộ được giữ đến khi ghi đè hoặc xóa qua cài đặt thiết bị; bản sao hệ thống theo quy tắc của hệ thống. Lưu đám mây và thứ hạng được giữ để cung cấp dịch vụ tài khoản và có thể được yêu cầu xóa. Chi tiết thống kê tuân theo thời hạn và chu kỳ dọn dẹp đã cấu hình, chỉ giữ trong phạm vi cần cho phân tích và cải thiện; báo cáo tổng hợp có thể giữ lâu hơn. Crashlytics thường bắt đầu xóa lỗi và mã liên quan khỏi hệ thống hoạt động và sao lưu sau 90 ngày. Mã khác theo quy tắc từng dịch vụ.\n\nBạn có thể rút lại đồng ý thống kê và lỗi trong Cài đặt, quản lý hồ sơ qua công cụ tài khoản hoặc dữ liệu trò chơi của Google. Gỡ ứng dụng, xóa dữ liệu cục bộ hoặc đăng xuất không xóa mọi hồ sơ đám mây và bên thứ ba. Rút lại đồng ý không tự xóa dữ liệu đã được xử lý hợp pháp.\n\nGửi email đến địa chỉ trên để yêu cầu truy cập, sửa, xuất hoặc xóa dữ liệu chúng tôi kiểm soát. Chúng tôi chỉ yêu cầu xác minh danh tính cần thiết và phản hồi trong thời hạn luật định. Chúng tôi xử lý yêu cầu về dữ liệu nhà cung cấp xử lý thay mình theo quy tắc áp dụng. Dữ liệu tài khoản Google quản lý độc lập được quản lý qua Google. Việc giữ theo luật được giới hạn mục đích và giải thích.","policy.changes":"8. Người chưa thành niên và thay đổi\nTrò chơi dành cho người từ 16 tuổi, không chuyên hướng đến trẻ em. Nếu chưa đạt tuổi địa phương cho phép tự đồng ý hợp lệ, phải có đồng ý của người giám hộ theo luật. Người giám hộ có thể báo thiếu cho phép qua email trên; chúng tôi xác minh và thực hiện biện pháp pháp lý cần thiết như dừng xử lý hoặc xóa.\n\nKhi thay đổi quan trọng, chúng tôi cập nhật chính sách và thông báo hoặc xin lại đồng ý theo luật. Có thể xem trong trò chơi và trang công khai.","policy.draft":"Bản nháp: đơn vị vận hành, email và URL công khai sẽ bổ sung trước phát hành.","policy.contact":"Nhà phát triển / thương hiệu: {brand}\nĐơn vị vận hành: {operator}\nLiên hệ về quyền riêng tư: {email}"}},"th":{"name":"ไทย","messages":{"policy.title":"นโยบายความเป็นส่วนตัว","policy.choice":"โปรดอ่านนโยบายและเลือกว่าจะยอมรับหรือไม่","policy.reject":"ไม่ยอมรับ","policy.accept":"ยอมรับและเล่น","policy.rejected":"ต้องยอมรับก่อนเข้า คุณสามารถปิดเกมได้","policy.saveFailed":"บันทึกไม่ได้ โปรดลองอีกครั้ง","policy.updated":"วันที่อัปเดต: {date}","policy.security":"6. ผู้ให้บริการ ความปลอดภัย และการโอนระหว่างประเทศ\nเราใช้ Google Play Games, AdMob, Firebase และบริการอื่น พร้อมมาตรการควบคุมการเข้าถึงและความปลอดภัยที่สมเหตุสมผล อาจให้ข้อมูลที่จำเป็นเพื่อปฏิบัติตามกฎหมาย ระงับข้อพิพาท หรือปกป้องสิทธิที่ชอบ\n\nผู้ให้บริการอาจประมวลผลนอกภูมิภาคของคุณ โดยใช้การรับรองความเพียงพอ ข้อสัญญามาตรฐาน หรือการคุ้มครองที่กฎหมายรับรองเมื่อใช้บังคับ ติดต่อเราเพื่อรายละเอียด เว็บไซต์ใช้งาน GitHub Pages และ GitHub อาจประมวลผล IP ผู้เข้าชมเพื่อความปลอดภัย","policy.regions":"7. ข้อกำหนดภูมิภาคและสิทธิ\nEEA และสหราชอาณาจักร: การประมวลผลบัญชีและคลาวด์ที่จำเป็นเป็นไปเพื่อให้บริการตามคำขอ สถิติและรายงานเสริมอาศัยความยินยอม การรักษาความปลอดภัยและป้องกันการใช้ผิดที่จำเป็นอาจอาศัยประโยชน์โดยชอบเมื่อกฎหมายอนุญาตและชั่งน้ำหนักสิทธิของคุณ ความยินยอมโฆษณาแยกต่างหาก สิทธิที่ใช้รวมถึงเข้าถึง แก้ไข ลบ จำกัด คัดค้าน โอนข้อมูล ถอนความยินยอม และร้องเรียนหน่วยงานท้องถิ่น การถอนไม่กระทบการประมวลผลที่ชอบก่อนหน้า\n\nภูมิภาคสหรัฐฯ ที่ใช้บังคับ: กฎหมายท้องถิ่นอาจให้สิทธิรับรู้ เข้าถึง แก้ไข ลบ และปฏิเสธการประมวลผลที่เป็นการขาย แบ่งปัน หรือโฆษณาเจาะจงตามกฎหมาย โดยไม่ถูกเลือกปฏิบัติอย่างผิดกฎหมาย\n\nภูมิภาคอื่นใช้สิทธิข้อมูลตามกฎหมายท้องถิ่น ขอบเขตกฎหมาย ไม่ใช่ภาษาแสดงผล กำหนดกฎ ส่งคำขอไปที่อีเมลด้านบน","policy.intro":"เราให้ความสำคัญกับความเป็นส่วนตัวของคุณ นโยบายนี้อธิบายว่า Sudoku ใช้ข้อมูลใดและเพื่อวัตถุประสงค์ใด","policy.local":"1. ข้อมูลเกม\nเราบันทึกความคืบหน้า ผลการเล่น และการตั้งค่าไว้บนอุปกรณ์ของคุณ เพื่อเก็บประวัติการเล่นและมอบประสบการณ์การเล่นเกมตามปกติ","policy.google":"2. บัญชีและการบันทึกบนคลาวด์\nGoogle Play Games ประมวลผลรหัสผู้เล่น ชื่อที่แสดง รูปประจำตัว อันดับ และผลการเล่น เพื่อระบุบัญชี แสดงโปรไฟล์และตารางอันดับ ข้อมูลอาจแสดงแก่ผู้เล่นอื่นตามการตั้งค่าของ Google\n\nเมื่อใช้คลาวด์ ความคืบหน้า ผลการเล่น บันทึกการผ่าน เกมที่ยังไม่จบ และรหัสซิงค์ที่จำเป็นจะเก็บผ่าน Google Play Games Saved Games เพื่อกู้คืนและซิงค์ระหว่างอุปกรณ์ การตั้งค่าในเครื่องและตัวเลือกความเป็นส่วนตัวไม่ซิงค์ การออกจากระบบไม่ลบบันทึกโดยอัตโนมัติ","policy.ads":"3. บริการโฆษณา\nเราใช้ Google AdMob เพื่อให้บริการโฆษณาแบบมีรางวัลที่คุณเลือกชมโดยสมัครใจ บริการโฆษณาอาจประมวลผลที่อยู่ IP และตำแหน่งโดยประมาณที่อนุมานจาก IP ข้อมูลอุปกรณ์และแอป ตัวระบุอุปกรณ์หรือบัญชี (รวมถึงตัวระบุโฆษณา) บันทึกการโต้ตอบ และข้อมูลการวินิจฉัย เพื่อแสดงโฆษณา วัดผล และป้องกันการฉ้อโกง ความยินยอมเกี่ยวกับโฆษณาจะดำเนินการแยกต่างหากตามข้อกำหนดของแต่ละภูมิภาค","policy.telemetry":"4. สถิติ รายงานข้อผิดพลาด และการกำหนดค่า\nเมื่อคุณเปิดใช้แต่ละบริการแยกกัน Firebase Analytics และ Crashlytics จะประมวลผลการใช้แอป ข้อมูลอุปกรณ์และระบบ รุ่นแอป รหัสการติดตั้ง และข้อผิดพลาด เพื่อเข้าใจการใช้และเพิ่มความเสถียร ถอนแต่ละตัวเลือกได้ในการตั้งค่า การเก็บข้อมูลเสริมไม่จำเป็นต่อการเล่น การปิดรายงานแบบเนทีฟทั้งหมดอาจต้องเริ่มแอปใหม่\n\nเมื่อเปิด Firebase Remote Config บริการอาจประมวลผลรหัสการติดตั้งเพื่อส่งการกำหนดค่าแอป","policy.rights":"5. การเก็บรักษาและจัดการข้อมูล\nข้อมูลในเครื่องเก็บจนถูกเขียนทับหรือลบผ่านการตั้งค่าอุปกรณ์ สำรองของระบบเป็นไปตามกฎระบบ คลาวด์และอันดับเก็บเพื่อบริการบัญชีและสามารถขอให้ลบได้ รายละเอียดสถิติใช้ระยะเวลาและรอบล้างตามการกำหนดค่า เก็บเท่าที่จำเป็นต่อการวิเคราะห์และปรับปรุง รายงานรวมอาจอยู่นานกว่า โดยปกติ Crashlytics เริ่มลบข้อผิดพลาดและรหัสที่เกี่ยวข้องจากระบบใช้งานและสำรองหลัง 90 วัน รหัสบริการอื่นเป็นไปตามกฎบริการนั้น\n\nถอนความยินยอมต่อสถิติและข้อผิดพลาดได้ในการตั้งค่า และจัดการบันทึกผ่านเครื่องมือบัญชีหรือข้อมูลเกมของ Google การถอนการติดตั้ง ลบข้อมูลในเครื่อง หรือออกจากระบบไม่ลบข้อมูลคลาวด์และของบุคคลที่สามทั้งหมด การถอนความยินยอมไม่ลบข้อมูลที่ประมวลผลโดยชอบแล้วโดยอัตโนมัติ\n\nส่งอีเมลขอเข้าถึง แก้ไข ส่งออก หรือลบข้อมูลที่เราควบคุมไปยังที่อยู่ด้านบน เราขอเพียงการยืนยันตัวตนที่จำเป็นและตอบภายในเวลาที่กฎหมายกำหนด เรารับผิดชอบคำขอเกี่ยวกับข้อมูลที่ผู้ให้บริการประมวลผลแทนเราตามกฎที่ใช้ ข้อมูลบัญชีที่ Google จัดการอิสระให้จัดการผ่าน Google การเก็บที่กฎหมายบังคับจะจำกัดวัตถุประสงค์และชี้แจงเหตุผล","policy.changes":"8. ผู้เยาว์และการเปลี่ยนแปลง\nเกมสำหรับผู้ใช้อายุ 16 ปีขึ้นไป ไม่ได้ออกแบบเฉพาะสำหรับเด็ก ผู้ที่ยังไม่ถึงอายุที่ท้องถิ่นอนุญาตให้ยินยอมได้เองอย่างมีผลต้องได้รับความยินยอมจากผู้ปกครองตามกฎหมาย ผู้ปกครองแจ้งการขาดอนุญาตผ่านอีเมลด้านบนได้ เราจะตรวจสอบและดำเนินการตามกฎหมาย เช่น หยุดประมวลผลหรือลบข้อมูล\n\nหากมีการเปลี่ยนแปลงสำคัญ เราจะอัปเดตนโยบายและแจ้งหรือขอความยินยอมใหม่ตามกฎหมาย อ่านได้ในเกมและเว็บไซต์สาธารณะ","policy.draft":"ฉบับร่าง: จะเพิ่มผู้ดำเนินการ อีเมลและ URL สาธารณะก่อนเผยแพร่","policy.contact":"ผู้พัฒนา / แบรนด์: {brand}\nผู้ดำเนินการ: {operator}\nติดต่อด้านความเป็นส่วนตัว: {email}"}},"nl":{"name":"Nederlands","messages":{"policy.title":"Privacybeleid","policy.choice":"Lees het beleid en kies of u akkoord gaat.","policy.reject":"Weigeren","policy.accept":"Akkoord en spelen","policy.rejected":"Akkoord is nodig. Je kunt het spel sluiten.","policy.saveFailed":"Opslaan mislukt. Probeer opnieuw.","policy.updated":"Laatst bijgewerkt: {date}","policy.security":"6. Aanbieders, veiligheid en internationale verwerking\nWe gebruiken onder meer Google Play Games, AdMob en Firebase en treffen redelijke beveiliging en toegangscontrole. Noodzakelijke informatie kan worden gedeeld voor wettelijke verplichtingen, geschillen of bescherming van legitieme rechten.\n\nAanbieders kunnen buiten uw regio verwerken, waar toepasselijk met adequaatheidsbesluiten, standaardcontractbepalingen of andere erkende waarborgen. Neem contact op voor details. De website gebruikt GitHub Pages; GitHub kan bezoekers-IP's voor veiligheid verwerken.","policy.regions":"7. Regionale bepalingen en rechten\nEER en VK: nodige account- en cloudverwerking voert uw gevraagde diensten uit; optionele statistieken en fouten steunen op toestemming. Nodige beveiliging en misbruikpreventie kunnen, waar wettelijk toegestaan en tegen uw rechten afgewogen, op gerechtvaardigde belangen steunen. Advertentietoestemming is apart. Toepasselijke rechten omvatten inzage, correctie, wissen, beperking, bezwaar, overdraagbaarheid, intrekking en klachten bij lokale toezichthouders. Intrekking tast eerdere rechtmatige verwerking niet aan.\n\nToepasselijke VS-regio's: lokale wetten kunnen kennis, toegang, correctie, verwijdering en afwijzing van verwerking aangemerkt als verkoop, delen of gerichte advertenties toestaan, zonder onrechtmatige discriminatie.\n\nElders gelden toepasselijke lokale gegevensrechten. Het bereik van de wet, niet de interfacetaal, bepaalt de regels. Stuur verzoeken naar het adres bovenaan.","policy.intro":"Wij respecteren uw privacy. Dit beleid legt uit welke informatie Sudoku gebruikt en waarvoor.","policy.local":"1. Spelgegevens\nWij slaan de voortgang, resultaten en instellingen op uw apparaat op om uw spelgegevens te bewaren en een normale spelervaring te bieden.","policy.google":"2. Accounts en cloudopslag\nGoogle Play Games verwerkt speler-ID, schermnaam, avatar, rang en resultaten voor accountherkenning, profielen en ranglijsten. Deze gegevens kunnen zichtbaar zijn volgens de privacyinstellingen van Google.\n\nBij cloudopslag worden voortgang, resultaten, voltooiingen, onvoltooide spellen en nodige synchronisatie-ID's via Google Play Games Saved Games bewaard voor herstel en synchronisatie tussen apparaten. Lokale instellingen en privacykeuzes worden niet gesynchroniseerd. Uitloggen verwijdert deze gegevens niet automatisch.","policy.ads":"3. Advertentiediensten\nWij gebruiken Google AdMob voor advertenties met beloning die u vrijwillig bekijkt. Advertentiediensten kunnen uw IP-adres en de daaruit afgeleide geschatte locatie, apparaat- en appgegevens, apparaat- of account-ID's (waaronder advertentie-ID's), interacties en diagnostische gegevens verwerken om advertenties te tonen, prestaties te meten en fraude te voorkomen. Toestemming voor advertenties wordt afzonderlijk behandeld volgens regionale vereisten.","policy.telemetry":"4. Statistieken, fouten en configuratie\nAls u ze afzonderlijk inschakelt, verwerken Firebase Analytics en Crashlytics appgebruik, apparaat- en systeemgegevens, versies, installatie-ID's en fouten om gebruik te begrijpen en stabiliteit te verbeteren. Elke keuze is intrekbaar in Instellingen; optionele verzameling is niet nodig om te spelen. Volledig stoppen van native foutrapporten kan een herstart vereisen.\n\nIndien ingeschakeld kan Firebase Remote Config installatie-ID's verwerken voor appconfiguratie.","policy.rights":"5. Bewaren en gegevensbeheer\nLokale gegevens blijven tot overschrijven of wissen via apparaatinstellingen; systeemback-ups volgen systeemregels. Cloudopslag en ranglijsten blijven voor accountdiensten en kunnen onderwerp van verwijderverzoeken zijn. Gedetailleerde statistieken volgen ingestelde bewaartermijnen en opruimcycli, alleen zolang nodig voor analyse en verbetering; samengevoegde rapporten kunnen langer blijven. Crashlytics begint doorgaans na 90 dagen bijbehorende fouten en ID's uit actieve en back-upsystemen te verwijderen. Andere ID's volgen de regels van hun dienst.\n\nU kunt toestemming voor statistieken en fouten intrekken in Instellingen en gegevens beheren via Google's account- of spelgegevensbeheer. Verwijderen van de app, wissen van lokale gegevens of uitloggen verwijdert niet alle cloud- en derdepartijgegevens. Intrekken wist eerder rechtmatig verwerkte gegevens niet automatisch.\n\nMail het adres bovenaan voor inzage, correctie, export of verwijdering van gegevens onder onze controle. We vragen alleen nodige identiteitscontrole en reageren binnen wettelijke termijnen. Wij behandelen verzoeken over door aanbieders namens ons verwerkte gegevens volgens de regels. Onafhankelijk door Google beheerde accountgegevens beheert u bij Google. Wettelijk vereiste bewaring is doelgebonden beperkt en toegelicht.","policy.changes":"8. Minderjarigen en wijzigingen\nHet spel is bedoeld voor gebruikers vanaf 16 jaar, niet specifiek voor kinderen. Onder de lokale leeftijd voor geldige zelfstandige toestemming is wettelijk vereiste ouderlijke toestemming nodig. Ouders of voogden kunnen ontbrekende toestemming melden op het adres bovenaan; wij onderzoeken en nemen wettelijke maatregelen zoals stoppen of wissen.\n\nBij wezenlijke wijzigingen werken we het beleid bij en informeren of vragen opnieuw toestemming waar vereist. Het beleid staat in het spel en op de openbare website.","policy.draft":"Concept: beheerder, e-mail en openbare URL worden vóór publicatie toegevoegd.","policy.contact":"Ontwikkelaar / merk: {brand}\nExploitant: {operator}\nPrivacycontact: {email}"}}}};const chooser=document.getElementById('language');for(const [code,locale] of Object.entries(data.dictionaries)){const option=document.createElement('option');option.value=code;option.textContent=locale.name;chooser.append(option)}
const params={brand:data.config.brandName,operator:data.config.operatorName,email:data.config.contactEmail,date:data.config.updatedOn};

function render(code){

  }
}
const lang=navigator.language||'en';chooser.value=Object.keys(data.dictionaries).find(k=>k.toLowerCase()===lang.toLowerCase())||(lang.startsWith('zh')?(lang.includes('TW')||lang.includes('HK')?'zh-Hant':'zh-Hans'):Object.keys(data.dictionaries).find(k=>k.split('-')[0]===lang.split('-')[0]))||'en';chooser.onchange=()=>render(chooser.value);render(chooser.value);</script></body></html>
